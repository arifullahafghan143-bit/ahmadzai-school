<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>د زده‌کوونکو مدیریت | احمدزي ښوونځی</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
header{background:linear-gradient(135deg,#123b66,#087f8c);color:white;text-align:center;padding:24px 12px}
header h1{font-size:25px;margin:0 0 10px}
header a{color:white;text-decoration:none}
.container{max-width:1150px;margin:20px auto;padding:12px}
.card{background:white;padding:20px;margin-bottom:20px;border-radius:14px;box-shadow:0 4px 18px #0000000c}
h2{font-size:20px;color:#123b66;margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}
label{display:block;font-weight:bold;margin-bottom:7px}
input,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
input:focus,select:focus{outline:2px solid #93c5fd}
button{border:0;background:#123b66;color:white;cursor:pointer;font-weight:bold}
button:disabled{opacity:.6;cursor:not-allowed}
.save{background:#087f5b;margin-top:18px}
.cancel{background:#64748b;margin-top:10px}
.edit{background:#d97706}
.delete{background:#dc2626}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{background:white;padding:18px;border-radius:12px;text-align:center;box-shadow:0 3px 12px #00000008}
.stat strong{display:block;font-size:27px;color:#087f8c;margin-top:8px}
.message{display:none;padding:13px;border-radius:8px;margin-bottom:15px;line-height:1.8;overflow-wrap:anywhere}
.message.success,.message.error,.message.info{display:block}
.message.success{background:#dcfce7;color:#166534}
.message.error{background:#fee2e2;color:#991b1b}
.message.info{background:#dbeafe;color:#1e40af}
#code{background:#f1f5f9;direction:ltr;text-align:center;font-weight:bold;color:#087f5b}
small{display:block;color:#64748b;margin-top:6px;line-height:1.7}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:11px 8px;border-bottom:1px solid #e2e8f0;text-align:center}
th{background:#eaf1f8;color:#123b66}
.actions{display:flex;gap:6px}
.actions button{padding:8px;min-width:60px}
[hidden]{display:none!important}
@media(max-width:600px){.container{padding:8px}.card{padding:14px}header h1{font-size:22px}}
</style>
</head>

<body>

<header>
    <h1>🏫 احمدزي ښوونځی</h1>
    <div>د زده‌کوونکو د مدیریت سیستم</div>
    <p><a href="dashboard.html">← ډشبورډ ته بېرته تلل</a></p>
</header>

<main class="container">

    <div id="message" class="message"></div>

    <div class="stats">
        <div class="stat">ټول زده‌کوونکي<strong id="totalStudents">0</strong></div>
        <div class="stat">هلکان<strong id="boysCount">0</strong></div>
        <div class="stat">نجونې<strong id="girlsCount">0</strong></div>
        <div class="stat">صنفونه<strong id="totalClasses">0</strong></div>
    </div>

    <section class="card">
        <h2 id="formTitle">➕ نوی زده‌کوونکی ثبت کړئ</h2>

        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="grid">
                <div>
                    <label for="code">د زده‌کوونکي اتومات کوډ</label>
                    <input id="code" readonly placeholder="د ثبت وروسته جوړېږي">
                    <small>سیستم به کوډ په اتومات ډول جوړ کړي.</small>
                </div>

                <div>
                    <label for="name">د زده‌کوونکي نوم *</label>
                    <input id="name" required placeholder="بشپړ نوم">
                </div>

                <div>
                    <label for="father">د پلار نوم *</label>
                    <input id="father" required placeholder="د پلار نوم">
                </div>

                <div>
                    <label for="className">صنف انتخاب کړئ *</label>
                    <select id="className" required disabled>
                        <option value="">صنفونه لوستل کېږي...</option>
                    </select>
                </div>

                <div>
                    <label for="gender">جنسیت *</label>
                    <select id="gender" required>
                        <option value="">جنسیت انتخاب کړئ</option>
                        <option value="هلک">هلک</option>
                        <option value="نجلۍ">نجلۍ</option>
                    </select>
                </div>

                <div>
                    <label for="phone">د ټیلیفون شمېره</label>
                    <input id="phone" type="tel" placeholder="د اړیکې شمېره">
                </div>

                <div>
                    <label for="address">پته</label>
                    <input id="address" placeholder="د اوسېدو ځای">
                </div>
            </div>

            <button id="saveButton" class="save" type="submit" disabled>
                زده‌کوونکی ثبت کړئ
            </button>

            <button id="cancelButton" class="cancel" type="button" hidden>
                اصلاح لغوه کړئ
            </button>
        </form>
    </section>

    <section class="card">
        <h2>📋 د زده‌کوونکو لېست</h2>
        <input id="searchInput" placeholder="د نوم، کوډ یا صنف له مخې لټون...">

        <div class="table-wrap" style="margin-top:15px">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>کوډ</th>
                        <th>نوم</th>
                        <th>د پلار نوم</th>
                        <th>صنف</th>
                        <th>جنسیت</th>
                        <th>ټیلیفون</th>
                        <th>پته</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="studentsBody">
                    <tr><td colspan="9">د زده‌کوونکو معلومات لوستل کېږي...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script>
"use strict";

/* د Supabase اتصال */
const SUPABASE_URL = "https://oaxmnfnaqhdvnykawvyh.supabase.co";
const SUPABASE_KEY = "sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7";

const form = document.getElementById("studentForm");
const studentsBody = document.getElementById("studentsBody");
const messageBox = document.getElementById("message");
const searchInput = document.getElementById("searchInput");
const saveButton = document.getElementById("saveButton");
const cancelButton = document.getElementById("cancelButton");
const classSelect = document.getElementById("className");

let students = [];
let classes = [];
let classesLoaded = false;
let busy = false;

function val(id){
    return document.getElementById(id).value.trim();
}

function str(value){
    return value == null ? "" : String(value);
}

function showMessage(text,type="info"){
    messageBox.textContent = text;
    messageBox.className = "message " + type;
}

function clearMessage(){
    messageBox.textContent = "";
    messageBox.className = "message";
}

/* API غوښتنه؛ د انتظار حد ۱۵ ثانیې دی */
async function apiRequest(path,options={}){

    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(),15000);

    try{
        const response = await fetch(
            SUPABASE_URL + "/rest/v1/" + path,
            {
                method:options.method || "GET",
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":"Bearer " + SUPABASE_KEY,
                    "Content-Type":"application/json",
                    "Accept":"application/json",
                    "Prefer":"return=representation"
                },
                body:options.body === undefined
                    ? undefined
                    : JSON.stringify(options.body),
                signal:controller.signal
            }
        );

        const text = await response.text();
        let data;

        try{
            data = text ? JSON.parse(text) : null;
        }catch{
            data = text;
        }

        if(!response.ok){
            const detail = data && typeof data === "object"
                ? (data.message || data.details || data.hint || JSON.stringify(data))
                : String(data || response.statusText);

            throw new Error("HTTP " + response.status + ": " + detail);
        }

        return data;

    }catch(error){
        if(error.name === "AbortError"){
            throw new Error("د سرور ځواب ۱۵ ثانیې وځنډېد. اتصال وګورئ.");
        }
        throw error;
    }finally{
        clearTimeout(timer);
    }
}

/* د صنفونو نوم له موجودو احتمالي کالمونو څخه اخلي */
function classNameOf(item){
    return str(item.name ?? item.Name ?? "").trim();
}

/* د صنفونو ډراپ‌ډاون جوړول */
function populateClassSelect(legacyClass=""){

    classSelect.innerHTML = "";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "— صنف انتخاب کړئ —";
    classSelect.appendChild(placeholder);

    classes.forEach(item=>{
        const name = classNameOf(item);
        if(!name) return;

        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        classSelect.appendChild(option);
    });

    if(
        legacyClass &&
        !classes.some(item=>classNameOf(item)===legacyClass)
    ){
        const option = document.createElement("option");
        option.value = legacyClass;
        option.textContent = legacyClass + " (پخوانی صنف)";
        classSelect.appendChild(option);
    }
}

/* د صنفونو لوستل */
async function loadClasses(){

    classesLoaded = false;
    classSelect.disabled = true;
    saveButton.disabled = true;
    classSelect.innerHTML =
        '<option value="">صنفونه لوستل کېږي...</option>';

    try{
        /*
         ټول کالمونه لوستل کېږي، ترڅو د اختیاري کالمونو نوم
         د غوښتنې د ناکامېدو سبب نه شي.
        */
        const data = await apiRequest("classes?select=*");

        if(!Array.isArray(data)){
            throw new Error("د صنفونو معلومات په سمه بڼه نه دي.");
        }

        classes = data.filter(item=>classNameOf(item)!=="");

        classes.sort((a,b)=>{
            const gradeA = Number(a.grade_number ?? a.grade ?? 0);
            const gradeB = Number(b.grade_number ?? b.grade ?? 0);

            if(gradeA !== gradeB) return gradeA-gradeB;

            return str(a.section).localeCompare(str(b.section));
        });

        populateClassSelect();

        if(classes.length===0){
            throw new Error(
                "د classes جدول ځواب ورکړ، خو د صنفونو نومونه پکې ونه موندل شول."
            );
        }

        classesLoaded = true;
        classSelect.disabled = false;
        saveButton.disabled = false;

        document.getElementById("totalClasses").textContent =
            classes.length;

        showMessage(
            "د صنفونو لېست په بریالیتوب ولوستل شو. ټول صنفونه: " +
            classes.length,
            "success"
        );

    }catch(error){
        console.error("د صنفونو ستونزه:",error);

        classSelect.innerHTML =
            '<option value="">د صنفونو لېست ونه لوستل شو</option>';

        showMessage(
            "د صنفونو ستونزه: " + error.message +
            " که ستونزه پاتې وي، د Supabase د classes جدول د SELECT اجازه وګورئ.",
            "error"
        );
    }finally{
        classSelect.disabled = !classesLoaded;
        saveButton.disabled = !classesLoaded || busy;
    }
}

/* د زده‌کوونکو لوستل */
async function loadStudents(){

    studentsBody.innerHTML =
        '<tr><td colspan="9">د زده‌کوونکو معلومات لوستل کېږي...</td></tr>';

    try{
        const data = await apiRequest(
            "students?select=*&order=id.desc"
        );

        students = Array.isArray(data) ? data : [];
        renderStudents();

    }catch(error){
        console.error("د زده‌کوونکو ستونزه:",error);

        studentsBody.innerHTML =
            '<tr><td colspan="9">د زده‌کوونکو معلومات ونه لوستل شول.</td></tr>';

        showMessage(
            "د زده‌کوونکو د لوستلو ستونزه: " + error.message,
            "error"
        );
    }
}

/* د لېست جوړول */
function renderStudents(){

    const query = searchInput.value.trim().toLowerCase();

    const filtered = students.filter(student=>{
        const text = [
            student.id,student.code,student.name,student.father,
            student.class,student.gender,student.phone,student.address
        ].map(str).join(" ").toLowerCase();

        return text.includes(query);
    });

    document.getElementById("totalStudents").textContent = students.length;
    document.getElementById("boysCount").textContent =
        students.filter(s=>s.gender==="هلک").length;
    document.getElementById("girlsCount").textContent =
        students.filter(s=>s.gender==="نجلۍ").length;

    studentsBody.innerHTML = "";

    if(filtered.length===0){
        studentsBody.innerHTML =
            '<tr><td colspan="9">زده‌کوونکي ونه موندل شول.</td></tr>';
        return;
    }

    filtered.forEach(student=>{
        const row = document.createElement("tr");

        [
            student.id,student.code,student.name,student.father,
            student.class,student.gender,student.phone,student.address
        ].forEach(value=>{
            const td = document.createElement("td");
            td.textContent = str(value) || "—";
            row.appendChild(td);
        });

        const td = document.createElement("td");
        const actions = document.createElement("div");
        actions.className = "actions";

        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "edit";
        edit.textContent = "اصلاح";
        edit.addEventListener("click",()=>editStudent(student.id));

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.textContent = "حذف";
        del.addEventListener("click",()=>deleteStudent(student.id));

        actions.append(edit,del);
        td.appendChild(actions);
        row.appendChild(td);
        studentsBody.appendChild(row);
    });
}

/* فورمه پاکول */
function resetForm(){

    form.reset();
    document.getElementById("studentId").value = "";
    document.getElementById("code").value = "";

    document.getElementById("formTitle").textContent =
        "➕ نوی زده‌کوونکی ثبت کړئ";

    saveButton.textContent = "زده‌کوونکی ثبت کړئ";
    cancelButton.hidden = true;

    populateClassSelect();
    classSelect.disabled = !classesLoaded;
    saveButton.disabled = !classesLoaded || busy;
}

/* ثبت او اصلاح */
form.addEventListener("submit",async event=>{

    event.preventDefault();
    clearMessage();

    if(busy) return;

    if(!classesLoaded){
        showMessage("د صنفونو لېست لا نه دی لوستل شوی.","error");
        return;
    }

    const id = val("studentId");
    const selectedClass = val("className");

    const record = {
        name:val("name"),
        father:val("father"),
        class:selectedClass,
        gender:val("gender"),
        phone:val("phone"),
        address:val("address")
    };

    if(!record.name || !record.father || !record.class || !record.gender){
        showMessage(
            "د زده‌کوونکي نوم، د پلار نوم، صنف او جنسیت ضروري دي.",
            "error"
        );
        return;
    }

    if(!id && !classes.some(item=>classNameOf(item)===selectedClass)){
        showMessage("صنف له لېست څخه انتخاب کړئ.","error");
        return;
    }

    if(id){
        const old = students.find(s=>String(s.id)===String(id));
        if(old && old.code) record.code = old.code;
    }

    busy = true;
    saveButton.disabled = true;
    cancelButton.disabled = true;
    saveButton.textContent = id ? "اصلاحات ثبتېږي..." : "ثبتېږي...";

    try{
        if(id){
            const result = await apiRequest(
                "students?id=eq."+encodeURIComponent(id),
                {method:"PATCH",body:record}
            );

            if(!Array.isArray(result) || result.length===0){
                throw new Error(
                    "ریکارډ بدل نه شو. د UPDATE اجازه وګورئ."
                );
            }

            showMessage("د زده‌کوونکي معلومات اصلاح شول.","success");

        }else{
            /*
             id او code نه لېږو.
             د جدول ID او د code Trigger یې باید جوړ کړي.
            */
            const result = await apiRequest(
                "students",
                {method:"POST",body:record}
            );

            if(!Array.isArray(result) || result.length===0){
                throw new Error("د ثبت شوي ریکارډ معلومات بېرته ترلاسه نه شول.");
            }

            const saved = result[0];

            showMessage(
                "زده‌کوونکی ثبت شو. کوډ: "+str(saved.code)+
                " | ID: "+str(saved.id),
                "success"
            );
        }

        await loadStudents();
        resetForm();

    }catch(error){
        console.error("د ثبت ستونزه:",error);
        showMessage("معلومات ثبت نه شول: "+error.message,"error");
    }finally{
        busy = false;
        cancelButton.disabled = false;
        saveButton.disabled = !classesLoaded;
        saveButton.textContent = val("studentId")
            ? "اصلاحات ثبت کړئ"
            : "زده‌کوونکی ثبت کړئ";
    }
});

/* اصلاح */
function editStudent(id){

    const student = students.find(s=>String(s.id)===String(id));
    if(!student) return;

    clearMessage();

    document.getElementById("studentId").value = str(student.id);
    document.getElementById("code").value = str(student.code);
    document.getElementById("name").value = str(student.name);
    document.getElementById("father").value = str(student.father);
    document.getElementById("gender").value = str(student.gender);
    document.getElementById("phone").value = str(student.phone);
    document.getElementById("address").value = str(student.address);

    populateClassSelect(str(student.class));
    classSelect.value = str(student.class);

    document.getElementById("formTitle").textContent =
        "✏️ د زده‌کوونکي معلومات اصلاح کړئ";

    saveButton.textContent = "اصلاحات ثبت کړئ";
    saveButton.disabled = !classesLoaded;
    cancelButton.hidden = false;

    window.scrollTo({top:0,behavior:"smooth"});
}

/* حذف */
async function deleteStudent(id){

    const student = students.find(s=>String(s.id)===String(id));
    if(!student) return;

    if(!confirm(
        "ایا د "+str(student.name)+" معلومات حذف کړئ؟\n"+
        "که فیسونه ورسره تړلي وي، حذف ممکن ناکام شي."
    )){
        return;
    }

    try{
        await apiRequest(
            "students?id=eq."+encodeURIComponent(id),
            {method:"DELETE"}
        );

        showMessage("د حذف غوښتنه ترسره شوه.","success");
        await loadStudents();

    }catch(error){
        console.error(error);
        showMessage("زده‌کوونکی حذف نه شو: "+error.message,"error");
    }
}

/* لټون او لغوه کول */
searchInput.addEventListener("input",renderStudents);

cancelButton.addEventListener("click",()=>{
    resetForm();
    clearMessage();
});

/* د سیستم پیل */
async function startSystem(){

    showMessage("د صنفونو لېست لوستل کېږي...","info");

    await loadClasses();
    await loadStudents();
}

startSystem();
</script>

</body>
</html>
