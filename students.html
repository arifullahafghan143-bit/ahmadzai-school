<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د زده‌کوونکو مدیریت | احمدزي ښوونځی</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

header{
    background:linear-gradient(135deg,#123b66,#176b87);
    color:white;
    padding:22px 15px;
    text-align:center;
}

header h2{margin:0 0 10px}
header a{color:white;text-decoration:none}

.container{
    max-width:1100px;
    margin:20px auto;
    padding:12px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:18px;
    border-radius:14px;
    box-shadow:0 4px 15px #0000000c;
}

h3{color:#123b66;margin-top:0}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,select,button{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
}

input,select{background:white;color:#1e293b}
input:focus,select:focus{
    outline:2px solid #93c5fd;
    border-color:#2563eb;
}

button{
    background:#123b66;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.save{background:#087f5b;margin-top:18px}
.cancel{background:#64748b;margin-top:10px}
.delete{background:#dc2626}
.edit{background:#d97706}

.search{margin-bottom:14px}

.table-wrap{overflow-x:auto}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,td{
    padding:11px 8px;
    border-bottom:1px solid #e2e8f0;
    text-align:center;
}

th{background:#eaf1f8;color:#123b66}

.actions{
    display:flex;
    gap:6px;
}

.actions button{
    padding:8px;
    min-width:65px;
}

.message{
    display:none;
    padding:13px;
    border-radius:8px;
    margin-bottom:15px;
    overflow-wrap:anywhere;
    line-height:1.8;
}

.message.success,.message.error,.message.info{display:block}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.info{background:#dbeafe;color:#1e40af}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:white;
    padding:18px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 12px #00000008;
}

.stat strong{
    display:block;
    font-size:25px;
    color:#123b66;
    margin-top:8px;
}

#code{
    background:#f1f5f9;
    font-weight:bold;
    color:#087f5b;
    direction:ltr;
    text-align:center;
}

small{
    display:block;
    margin-top:6px;
    color:#64748b;
    line-height:1.7;
}

[hidden]{display:none!important}

@media(max-width:600px){
    .container{padding:8px}
    .card{padding:14px}
    header{padding:18px 10px}
}
</style>
</head>

<body>

<header>
    <h2>🏫 احمدزي ښوونځی</h2>
    <div>د زده‌کوونکو د مدیریت سیستم</div>
    <p><a href="dashboard.html">← ډشبورډ ته بېرته تلل</a></p>
</header>

<main class="container">

    <div id="message" class="message"></div>

    <div class="stats">
        <div class="stat">
            ټول زده‌کوونکي
            <strong id="totalStudents">0</strong>
        </div>
        <div class="stat">
            هلکان
            <strong id="boysCount">0</strong>
        </div>
        <div class="stat">
            نجونې
            <strong id="girlsCount">0</strong>
        </div>
    </div>

    <section class="card">
        <h3 id="formTitle">➕ نوی زده‌کوونکی ثبت کړئ</h3>

        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="grid">

                <div>
                    <label for="code">د زده‌کوونکي اتومات کوډ</label>
                    <input
                        id="code"
                        type="text"
                        placeholder="د ثبت وروسته جوړېږي"
                        readonly
                    >
                    <small>
                        کوډ په اتومات ډول جوړېږي؛ په لاس یې مه لیکئ.
                    </small>
                </div>

                <div>
                    <label for="name">د زده‌کوونکي نوم *</label>
                    <input id="name" required placeholder="بشپړ نوم">
                </div>

                <div>
                    <label for="father">د پلار نوم *</label>
                    <input id="father" required placeholder="د پلار نوم">
                </div>

                <div>
                    <label for="className">صنف انتخاب کړئ *</label>
                    <select id="className" required disabled>
                        <option value="">د صنفونو لېست لوستل کېږي...</option>
                    </select>
                </div>

                <div>
                    <label for="gender">جنسیت *</label>
                    <select id="gender" required>
                        <option value="">جنسیت انتخاب کړئ</option>
                        <option value="هلک">هلک</option>
                        <option value="نجلۍ">نجلۍ</option>
                    </select>
                </div>

                <div>
                    <label for="phone">د ټیلیفون شمېره</label>
                    <input id="phone" type="tel" placeholder="د اړیکې شمېره">
                </div>

                <div>
                    <label for="address">پته</label>
                    <input id="address" placeholder="د اوسېدو ځای">
                </div>

            </div>

            <button class="save" id="saveButton" type="submit" disabled>
                زده‌کوونکی ثبت کړئ
            </button>

            <button class="cancel" id="cancelButton" type="button" hidden>
                اصلاح لغوه کړئ
            </button>
        </form>
    </section>

    <section class="card">
        <h3>📋 د زده‌کوونکو لېست</h3>

        <input
            id="searchInput"
            class="search"
            placeholder="د نوم، کوډ یا صنف له مخې لټون..."
        >

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>شمېره</th>
                        <th>کوډ</th>
                        <th>نوم</th>
                        <th>د پلار نوم</th>
                        <th>صنف</th>
                        <th>جنسیت</th>
                        <th>ټیلیفون</th>
                        <th>پته</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="studentsBody">
                    <tr>
                        <td colspan="9">معلومات لوستل کېږي...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script>
"use strict";

/* 1. د Supabase اتصال */

const SUPABASE_URL =
    "https://oaxmnfnaqhdvnykawvyh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7";

/* 2. د HTML عناصرو پېژندنه */

const form = document.getElementById("studentForm");
const studentsBody = document.getElementById("studentsBody");
const messageBox = document.getElementById("message");
const searchInput = document.getElementById("searchInput");
const saveButton = document.getElementById("saveButton");
const cancelButton = document.getElementById("cancelButton");
const classSelect = document.getElementById("className");

let students = [];
let classes = [];
let classesLoaded = false;
let busy = false;

/* 3. عمومي دندې */

function valueOf(id){
    return document.getElementById(id).value.trim();
}

function safeValue(value){
    return value == null ? "" : String(value);
}

function showMessage(text,type="info"){
    messageBox.textContent = text;
    messageBox.className = "message " + type;
}

function clearMessage(){
    messageBox.textContent = "";
    messageBox.className = "message";
}

/* 4. د Supabase API */

async function apiRequest(path,options={}){

    const headers = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Accept": "application/json",
        "Prefer": "return=representation"
    };

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + path,
        {
            method: options.method || "GET",
            headers,
            body: options.body === undefined
                ? undefined
                : JSON.stringify(options.body)
        }
    );

    const responseText = await response.text();

    let data = null;

    try{
        data = responseText ? JSON.parse(responseText) : null;
    }catch{
        data = responseText;
    }

    if(!response.ok){

        const detail =
            data && typeof data === "object"
                ? (
                    data.message ||
                    data.details ||
                    data.hint ||
                    JSON.stringify(data)
                )
                : String(data || response.statusText);

        throw new Error(
            "Supabase " + response.status + ": " + detail
        );
    }

    return data;
}

/* 5. د صنفونو لېست */

function populateClassSelect(legacyClass=""){

    classSelect.innerHTML = "";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "— صنف انتخاب کړئ —";
    classSelect.appendChild(placeholder);

    classes.forEach(item=>{

        const className = safeValue(item.name);

        if(!className) return;

        const option = document.createElement("option");
        option.value = className;
        option.textContent = className;
        classSelect.appendChild(option);
    });

    if(
        legacyClass &&
        !classes.some(item=>safeValue(item.name)===legacyClass)
    ){
        const option = document.createElement("option");
        option.value = legacyClass;
        option.textContent = legacyClass + " (پخوانی صنف)";
        classSelect.appendChild(option);
    }
}

async function loadClasses(){

    classesLoaded = false;
    classSelect.disabled = true;
    saveButton.disabled = true;

    try{

        const data = await apiRequest(
            "classes?select=id,code,name,grade_number,section"
        );

        classes = Array.isArray(data) ? data : [];

        classes = classes.filter(item=>
            item.name != null &&
            String(item.name).trim() !== "" &&
            item.grade_number != null &&
            item.section != null
        );

        classes.sort((a,b)=>{

            const gradeDifference =
                Number(a.grade_number)-Number(b.grade_number);

            if(gradeDifference !== 0) return gradeDifference;

            return safeValue(a.section).localeCompare(
                safeValue(b.section)
            );
        });

        populateClassSelect();

        if(classes.length===0){
            throw new Error("د صنفونو لېست تش دی.");
        }

        classesLoaded = true;
        classSelect.disabled = false;
        saveButton.disabled = false;

        if(classes.length!==48){
            showMessage(
                "خبرتیا: " + classes.length +
                " صنفونه لوستل شوي؛ تمه ۴۸ صنفونه ده.",
                "info"
            );
        }

    }catch(error){

        console.error("د صنفونو ستونزه:",error);

        classSelect.innerHTML =
            '<option value="">د صنفونو لوستل ناکام شول</option>';

        showMessage(
            "د صنفونو لېست ترلاسه نه شو: " + error.message,
            "error"
        );

    }finally{

        classSelect.disabled = !classesLoaded;
        saveButton.disabled = !classesLoaded || busy;
    }
}

/* 6. د زده‌کوونکو لوستل */

async function loadStudents(){

    studentsBody.innerHTML =
        '<tr><td colspan="9">معلومات لوستل کېږي...</td></tr>';

    try{

        const data = await apiRequest(
            "students?select=*&order=id.desc"
        );

        students = Array.isArray(data) ? data : [];
        renderStudents();

    }catch(error){

        console.error("د زده‌کوونکو ستونزه:",error);

        studentsBody.innerHTML =
            '<tr><td colspan="9">معلومات ونه لوستل شول.</td></tr>';

        showMessage(
            "د زده‌کوونکو د لوستلو ستونزه: " + error.message,
            "error"
        );
    }
}

/* 7. د زده‌کوونکو لېست او شمېرې */

function renderStudents(){

    const search = searchInput.value.trim().toLowerCase();

    const filtered = students.filter(student=>{

        const text = [
            student.id,
            student.code,
            student.name,
            student.father,
            student.class,
            student.phone,
            student.gender,
            student.address
        ].map(safeValue).join(" ").toLowerCase();

        return text.includes(search);
    });

    studentsBody.innerHTML = "";

    document.getElementById("totalStudents").textContent =
        students.length;

    document.getElementById("boysCount").textContent =
        students.filter(s=>s.gender==="هلک").length;

    document.getElementById("girlsCount").textContent =
        students.filter(s=>s.gender==="نجلۍ").length;

    if(filtered.length===0){

        studentsBody.innerHTML =
            '<tr><td colspan="9">زده‌کوونکي ونه موندل شول.</td></tr>';

        return;
    }

    filtered.forEach(student=>{

        const row = document.createElement("tr");

        const fields = [
            student.id,
            student.code,
            student.name,
            student.father,
            student.class,
            student.gender,
            student.phone,
            student.address
        ];

        fields.forEach(value=>{

            const cell = document.createElement("td");
            cell.textContent = safeValue(value) || "—";
            row.appendChild(cell);
        });

        const actionCell = document.createElement("td");
        const actions = document.createElement("div");
        actions.className = "actions";

        const editButton = document.createElement("button");
        editButton.textContent = "اصلاح";
        editButton.className = "edit";
        editButton.type = "button";
        editButton.addEventListener("click",()=>editStudent(student.id));

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "حذف";
        deleteButton.className = "delete";
        deleteButton.type = "button";
        deleteButton.addEventListener("click",()=>deleteStudent(student.id));

        actions.append(editButton,deleteButton);
        actionCell.appendChild(actions);
        row.appendChild(actionCell);
        studentsBody.appendChild(row);
    });
}

/* 8. د فورمې پاکول */

function resetForm(){

    form.reset();

    document.getElementById("studentId").value = "";
    document.getElementById("code").value = "";

    document.getElementById("formTitle").textContent =
        "➕ نوی زده‌کوونکی ثبت کړئ";

    saveButton.textContent = "زده‌کوونکی ثبت کړئ";
    cancelButton.hidden = true;

    classSelect.disabled = !classesLoaded;
    saveButton.disabled = !classesLoaded || busy;
}

/* 9. د نوي زده‌کوونکي ثبت او اصلاح */

form.addEventListener("submit",async function(event){

    event.preventDefault();
    clearMessage();

    if(busy) return;

    if(!classesLoaded){
        showMessage("لومړی باید د صنفونو لېست ولوستل شي.","error");
        return;
    }

    const id = valueOf("studentId");
    const selectedClass = valueOf("className");

    const record = {
        name: valueOf("name"),
        father: valueOf("father"),
        class: selectedClass,
        gender: valueOf("gender"),
        phone: valueOf("phone"),
        address: valueOf("address")
    };

    if(
        !record.name ||
        !record.father ||
        !record.class ||
        !record.gender
    ){
        showMessage(
            "د زده‌کوونکي نوم، د پلار نوم، صنف او جنسیت ضروري دي.",
            "error"
        );
        return;
    }

    if(!id){

        const validClass = classes.some(
            item=>safeValue(item.name)===selectedClass
        );

        if(!validClass){
            showMessage(
                "مهرباني وکړئ صنف له لېست څخه انتخاب کړئ.",
                "error"
            );
            return;
        }

    }else{

        /*
         د اصلاح پر مهال پخوانی کوډ ساتل کېږي.
        */

        const existing = students.find(
            student=>String(student.id)===String(id)
        );

        if(existing && existing.code){
            record.code = existing.code;
        }
    }

    busy = true;
    saveButton.disabled = true;
    cancelButton.disabled = true;

    saveButton.textContent = id
        ? "اصلاحات ثبتېږي..."
        : "معلومات ثبتېږي...";

    try{

        if(id){

            const updated = await apiRequest(
                "students?id=eq." + encodeURIComponent(id),
                {
                    method:"PATCH",
                    body:record
                }
            );

            if(!Array.isArray(updated) || updated.length===0){
                throw new Error(
                    "معلومات بدل نه شول. د Supabase اجازې وګورئ."
                );
            }

            showMessage(
                "د زده‌کوونکي معلومات په بریالیتوب اصلاح شول.",
                "success"
            );

        }else{

            /*
             code نه لېږو.
             د ډیټابېس Trigger به یې جوړ کړي.
             id هم نه لېږو؛ Identity Column یې جوړوي.
            */

            const inserted = await apiRequest(
                "students",
                {
                    method:"POST",
                    body:record
                }
            );

            if(!Array.isArray(inserted) || inserted.length===0){
                throw new Error(
                    "ثبت بشپړ شو، خو د ثبت شوي ریکارډ معلومات بېرته ترلاسه نه شول."
                );
            }

            const newStudent = inserted[0];

            /*
             د ثبت شوي زده‌کوونکي کوډ په فورمه کې ښکاره کول.
            */

            document.getElementById("code").value =
                safeValue(newStudent.code);

            showMessage(
                "زده‌کوونکی په بریالیتوب ثبت شو. کوډ: " +
                safeValue(newStudent.code) +
                " | ID: " + safeValue(newStudent.id),
                "success"
            );
        }

        await loadStudents();

        /*
         د بریالي ثبت یا اصلاح وروسته فورمه پاکول.
        */

        resetForm();

    }catch(error){

        console.error("د ثبت ستونزه:",error);

        showMessage(
            "معلومات ثبت نه شول: " + error.message,
            "error"
        );

    }finally{

        busy = false;
        cancelButton.disabled = false;
        saveButton.disabled = !classesLoaded;
        saveButton.textContent = valueOf("studentId")
            ? "اصلاحات ثبت کړئ"
            : "زده‌کوونکی ثبت کړئ";
    }
});

/* 10. د زده‌کوونکي اصلاح */

function editStudent(id){

    const student = students.find(
        item=>String(item.id)===String(id)
    );

    if(!student){
        showMessage("زده‌کوونکی ونه موندل شو.","error");
        return;
    }

    clearMessage();

    document.getElementById("studentId").value =
        safeValue(student.id);

    document.getElementById("code").value =
        safeValue(student.code);

    document.getElementById("name").value =
        safeValue(student.name);

    document.getElementById("father").value =
        safeValue(student.father);

    document.getElementById("gender").value =
        safeValue(student.gender);

    document.getElementById("phone").value =
        safeValue(student.phone);

    document.getElementById("address").value =
        safeValue(student.address);

    populateClassSelect(safeValue(student.class));

    classSelect.value = safeValue(student.class);

    document.getElementById("formTi
