<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>احمدزي عالي لېسه | ډشبورډ</title>

<style>
:root {
    --primary: #087f5b;
    --primary-dark: #066647;
    --primary-light: #e5f5ef;
    --bg: #f4f7f9;
    --white: #ffffff;
    --text: #172b3a;
    --muted: #718096;
    --border: #e7edf1;
    --sidebar: #102d29;
    --sidebar-muted: #b5cbc4;
    --blue: #3478f6;
    --orange: #f59e0b;
    --purple: #8864e8;
    --red: #e05260;
    --shadow: 0 5px 24px rgba(25, 50, 60, .055);
    --radius: 16px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}

.app {
    display: flex;
    min-height: 100vh;
}

/* ===== Sidebar ===== */

.sidebar {
    width: 255px;
    background: var(--sidebar);
    color: white;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: .25s;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 7px 26px;
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.brand-logo {
    width: 47px;
    height: 47px;
    background: linear-gradient(135deg, #20b486, #087f5b);
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 25px;
    font-weight: bold;
    box-shadow: 0 5px 18px rgba(0,0,0,.15);
}

.brand h2 {
    font-size: 16px;
    line-height: 1.8;
}

.brand p {
    font-size: 11px;
    color: var(--sidebar-muted);
    margin-top: 2px;
}

.menu-label {
    font-size: 11px;
    color: #829d94;
    padding: 24px 12px 10px;
}

.nav-menu {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    color: var(--sidebar-muted);
    background: transparent;
    border: 0;
    border-radius: 11px;
    text-align: right;
    font-size: 13px;
    transition: .2s;
}

.nav-item:hover,
.nav-item.active {
    color: white;
    background: rgba(32,180,134,.17);
}

.nav-item.active {
    border-right: 3px solid #31d6a0;
}

.nav-icon {
    width: 24px;
    text-align: center;
    font-size: 19px;
}

.sidebar-bottom {
    margin-top: auto;
    padding-top: 25px;
}

.school-card {
    padding: 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.09);
}

.school-card .small {
    color: var(--sidebar-muted);
    font-size: 11px;
    line-height: 2;
}

.school-card strong {
    display: block;
    margin: 7px 0;
    font-size: 13px;
}

.status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #38d9a9;
    border-radius: 50%;
    margin-left: 5px;
}

/* ===== Main ===== */

.main {
    min-width: 0;
    flex: 1;
    padding: 25px 30px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 30px;
}

.topbar-right,
.topbar-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.menu-toggle {
    display: none;
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: white;
    font-size: 22px;
}

.page-title h1 {
    font-size: 23px;
    margin-bottom: 8px;
}

.page-title p {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
}

.search-box {
    width: 235px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 13px;
    height: 44px;
}

.search-box span {
    font-size: 18px;
    color: var(--muted);
}

.search-box input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 12px;
}

.icon-button {
    width: 44px;
    height: 44px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 19px;
    position: relative;
}

.notification-dot {
    position: absolute;
    top: 9px;
    left: 10px;
    width: 7px;
    height: 7px;
    background: var(--red);
    border-radius: 50%;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 43px;
    height: 43px;
    border-radius: 13px;
    background: var(--primary-light);
    color: var(--primary);
    display: grid;
    place-items: center;
    font-size: 21px;
}

.profile-info strong {
    display: block;
    font-size: 12px;
    margin-bottom: 5px;
}

.profile-info span {
    color: var(--muted);
    font-size: 10px;
}

/* ===== Welcome Banner ===== */

.welcome {
    background: linear-gradient(110deg, #075e46, #0b9270);
    color: white;
    padding: 26px 28px;
    border-radius: 19px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    position: relative;
    overflow: hidden;
    margin-bottom: 27px;
    box-shadow: 0 10px 28px rgba(8,127,91,.13);
}

.welcome::after {
    content: "";
    position: absolute;
    width: 240px;
    height: 240px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 50%;
    left: -60px;
    top: -130px;
}

.welcome::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 50%;
    left: 30px;
    bottom: -130px;
}

.welcome-content {
    position: relative;
    z-index: 1;
}

.welcome h2 {
    font-size: 21px;
    margin-bottom: 11px;
}

.welcome p {
    color: rgba(255,255,255,.83);
    font-size: 12px;
    line-height: 2;
}

.welcome-date {
    position: relative;
    z-index: 1;
    min-width: 155px;
    padding: 15px 18px;
    border-radius: 13px;
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.15);
}

.welcome-date span {
    font-size: 11px;
    color: rgba(255,255,255,.8);
}

.welcome-date strong {
    display: block;
    margin-top: 9px;
    font-size: 14px;
}

/* ===== Section Heading ===== */

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 27px 0 17px;
}

.section-heading h2 {
    font-size: 16px;
}

.section-heading p {
    color: var(--muted);
    font-size: 11px;
    margin-top: 6px;
}

.text-button {
    border: 0;
    background: transparent;
    color: var(--primary);
    font-size: 12px;
    font-weight: bold;
}

/* ===== Statistics ===== */

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 17px;
}

.stat-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    transition: transform .2s, box-shadow .2s;
    min-width: 0;
}

.stat-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(25,50,60,.09);
}

.stat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.stat-icon {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    font-size: 22px;
}

.green {
    background: #e2f7ed;
    color: #087f5b;
}

.blue {
    background: #e7efff;
    color: #3478f6;
}

.orange {
    background: #fff2d9;
    color: #d88a05;
}

.purple {
    background: #f0eaff;
    color: #8864e8;
}

.red {
    background: #ffebed;
    color: #e05260;
}

.cyan {
    background: #e2f7fa;
    color: #1594a8;
}

.stat-label {
    color: var(--muted);
    font-size: 12px;
    margin-top: 17px;
}

.stat-number {
    font-size: 29px;
    font-weight: bold;
    margin-top: 9px;
    letter-spacing: .3px;
}

.stat-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
    margin-top: 15px;
    padding-top: 13px;
    border-top: 1px solid #f0f3f5;
}

.stat-footer span {
    font-size: 10px;
    color: var(--muted);
}

.stat-footer button {
    border: 0;
    background: var(--primary-light);
    color: var(--primary);
    padding: 7px 9px;
    border-radius: 8px;
    font-size: 10px;
}

/* ===== Middle Layout ===== */

.middle-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 18px;
    margin-top: 25px;
}

.panel {
    min-width: 0;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
}

.panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 25px;
}

.panel-title h3 {
    font-size: 14px;
}

.panel-title p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 7px;
}

.select-small {
    border: 1px solid var(--border);
    background: white;
    border-radius: 9px;
    padding: 8px;
    color: var(--muted);
    font-size: 11px;
}

/* ===== Attendance Chart ===== */

.chart {
    height: 205px;
    display: flex;
    align-items: stretch;
    gap: 15px;
}

.chart-y {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #94a3ad;
    font-size: 10px;
    padding-bottom: 25px;
}

.chart-area {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.chart-bars {
    flex: 1;
    display: flex;
    align-items: end;
    justify-content: space-around;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: repeating-linear-gradient(
        to top,
        transparent 0,
        transparent 48px,
        #edf1f4 49px,
        transparent 50px
    );
}

.bar-group {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: end;
    justify-content: center;
    gap: 5px;
    position: relative;
}

.bar {
    width: min(23px, 40%);
    border-radius: 6px 6px 0 0;
    min-height: 4px;
    transition: height .5s;
}

.bar.present {
    background: linear-gradient(180deg, #31c99a, #087f5b);
}

.bar.absent {
    background: #f8c66b;
}

.chart-labels {
    display: flex;
    justify-content: space-around;
    gap: 5px;
    padding-top: 10px;
}

.chart-labels span {
    flex: 1;
    text-align: center;
    color: var(--muted);
    font-size: 10px;
}

/* ===== Quick Actions ===== */

.actions-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.action-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 12px;
    background: #fafcfd;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: right;
    transition: .2s;
}

.action-card:hover {
    background: var(--primary-light);
    border-color: #b7e5d4;
}

.action-icon {
    flex-shrink: 0;
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    font-size: 20px;
}

.action-card strong {
    display: block;
    font-size: 11px;
    line-height: 1.8;
}

.action-card span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    margin-top: 3px;
}

/* ===== Table ===== */

.table-panel {
    margin-top: 25px;
}

.table-wrap {
    overflow-x: auto;
    width: 100%;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 530px;
}

thead {
    background: #f7f9fa;
}

th {
    text-align: right;
    padding: 14px 13px;
    font-size: 11px;
    color: var(--muted);
    font-weight: normal;
}

td {
    padding: 15px 13px;
    border-bottom: 1px solid #edf1f4;
    font-size: 12px;
    white-space: nowrap;
}

tbody tr:last-child td {
    border-bottom: 0;
}

tbody tr:hover {
    background: #fbfdfc;
}

.student-cell {
    display: flex;
    align-items: center;
    gap: 10px;
}

.student-avatar {
    width: 35px;
    height: 35px;
    border-radius: 10px;
    background: var(--primary-light);
    color: var(--primary);
    display: grid;
    place-items: center;
    font-weight: bold;
    font-size: 13px;
}

.student-cell strong {
    display: block;
    font-size: 11px;
}

.student-cell small {
    display: block;
    color: var(--muted);
    font-size: 10px;
    margin-top: 5px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 10px;
}

.badge-green {
    color: #087f5b;
    background: #e3f7ed;
}

.badge-orange {
    color: #b87908;
    background: #fff2d8;
}

.badge-red {
    color: #c63c4b;
    background: #ffebed;
}

.empty-row {
    text-align: center;
    color: var(--muted);
    padding: 25px;
}

/* ===== Footer ===== */

.footer {
    margin-top: 25px;
    padding: 20px 0 5px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: 10px;
    line-height: 2;
}

/* ===== Overlay and Toast ===== */

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,25,25,.45);
    z-index: 90;
}

.toast {
    position: fixed;
    bottom: 22px;
    left: 22px;
    z-index: 200;
    background: #123c31;
    color: white;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.9;
    box-shadow: 0 8px 30px rgba(0,0,0,.2);
    display: none;
    max-width: calc(100vw - 44px);
}

/* ===== Responsive ===== */

@media (max-width: 1200px) {
    .main {
        padding: 22px;
    }

    .sidebar {
        width: 225px;
    }

    .stats-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .stat-card {
        padding: 16px;
    }

    .middle-grid {
        grid-template-columns: 1fr 1fr;
    }

    .profile-info {
        display: none;
    }
}

@media (max-width: 900px) {
    .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 100;
        width: 260px;
        transform: translateX(105%);
        overflow-y: auto;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .overlay.show {
        display: block;
    }

    .menu-toggle {
        display: block;
    }

    .main {
        width: 100%;
        padding: 20px;
    }

    .middle-grid {
        grid-template-columns: 1fr;
    }

    .profile-info {
        display: block;
    }
}

@media (max-width: 600px) {
    .main {
        padding: 14px;
    }

    .topbar {
        margin-bottom: 22px;
        gap: 9px;
    }

    .topbar-right {
        gap: 9px;
    }

    .topbar-left {
        gap: 7px;
    }

    .page-title h1 {
        font-size: 17px;
    }

    .page-title p {
        font-size: 10px;
    }

    .search-box {
        display: none;
    }

    .icon-button {
        width: 39px;
        height: 39px;
    }

    .menu-toggle {
        width: 39px;
        height: 39px;
    }

    .profile {
        gap: 6px;
    }

    .profile-info {
        display: none;
    }

    .avatar {
        width: 39px;
        height: 39px;
    }

    .welcome {
        padding: 20px;
        align-items: flex-start;
        flex-direction: column;
        gap: 15px;
    }

    .welcome h2 {
        font-size: 18px;
    }

    .welcome p {
        font-size: 11px;
    }

    .welcome-date {
        width: 100%;
        padding: 12px;
    }

    .welcome-date strong {
        font-size: 13px;
    }

    .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
    }

    .stat-card {
        padding: 14px;
        border-radius: 13px;
    }

    .stat-icon {
        width: 39px;
        height: 39px;
        font-size: 19px;
    }

    .stat-label {
        font-size: 11px;
        margin-top: 13px;
    }

    .stat-number {
        font-size: 25px;
    }

    .stat-footer {
        align-items: flex-start;
        flex-direction: column;
    }

    .stat-footer span {
        font-size: 9px;
    }

    .section-heading {
        margin: 23px 0 13px;
    }

    .section-heading h2 {
        font-size: 14px;
    }

    .panel {
        padding: 15px;
    }

    .chart {
        gap: 8px;
        height: 175px;
    }

    .chart-bars {
        gap: 4px;
    }

    .bar-group {
        gap: 3px;
    }

    .bar {
        width: 40%;
    }

    .actions-grid {
        gap: 8px;
    }

    .action-card {
        padding: 12px 9px;
        gap: 8px;
    }

    .action-icon {
        width: 33px;
        height: 33px;
        font-size: 17px;
    }

    .action-card strong {
        font-size: 10px;
    }

    .action-card span {
        font-size: 9px;
    }

    .table-panel {
        padding: 13px;
    }

    .footer {
        flex-direction: column;
        gap: 5px;
    }
}

@media (max-width: 360px) {
    .stats-grid {
        grid-template-columns: 1fr;
    }

    .stat-footer {
        flex-direction: row;
        align-items: center;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-logo">ا</div>
            <div>
                <h2>احمدزي عالي لېسه</h2>
                <p>د ښوونځي مدیریت سیستم</p>
            </div>
        </div>

        <div class="menu-label">اصلي مینو</div>

        <nav class="nav-menu">

            <button class="nav-item active"
                data-page="dashboard"
                onclick="openPage('dashboard.html','ډشبورډ',this)">
                <span class="nav-icon">▦</span>
                <span>ډشبورډ</span>
            </button>

            <button class="nav-item"
                onclick="openPage('students.html','زده‌کوونکي',this)">
                <span class="nav-icon">♙</span>
                <span>زده‌کوونکي</span>
            </button>

            <button class="nav-item"
                onclick="openPage('teachers.html','استادان',this)">
                <span class="nav-icon">♟</span>
                <span>استادان</span>
            </button>

            <button class="nav-item"
                onclick="openPage('classes.html','ټولګي',this)">
                <span class="nav-icon">▤</span>
                <span>ټولګي</span>
            </button>

            <button class="nav-item"
                onclick="openPage('subjects.html','مضامین',this)">
                <span class="nav-icon">▧</span>
                <span>مضامین</span>
            </button>

            <button class="nav-item"
                onclick="openPage('attendance.html','حاضري',this)">
                <span class="nav-icon">✓</span>
                <span>حاضري</span>
            </button>

            <div class="menu-label">تعلیمي چارې</div>

            <button class="nav-item"
                onclick="openPage('results-new.html','د نمرو ثبت',this)">
                <span class="nav-icon">✎</span>
                <span>د نمرو ثبت</span>
            </button>

            <button class="nav-item"
                onclick="openPage('results-report.html','د پایلو راپور',this)">
                <span class="nav-icon">▥</span>
                <span>د پایلو راپور</span>
            </button>

            <button class="nav-item"
                onclick="openPage('fees.html','فیسونه',this)">
                <span class="nav-icon">؋</span>
                <span>فیسونه</span>
