<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>د صنفونو مدیریت</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.header{
    background:linear-gradient(135deg,#ea580c,#c2410c);
    color:white;
    padding:22px 18px;
    box-shadow:0 4px 15px #0002;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:7px 0 0;
    opacity:.9;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.status{
    display:inline-block;
    padding:8px 14px;
    border-radius:20px;
    background:white;
    box-shadow:0 2px 8px #0001;
    font-size:14px;
}

.online{color:#087f5b}
.offline{color:#c92a2a}

.add-btn{
    background:#ea580c;
    color:white;
    border:0;
    border-radius:10px;
    padding:11px 16px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #d8dee9;
    border-radius:10px;
    margin-bottom:18px;
    font-family:inherit;
    font-size:15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 3px 12px #0000000d;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:26px;
    margin-top:5px;
}

.card{
    background:white;
    border-radius:15px;
    box-shadow:0 3px 15px #0000000d;
    overflow:hidden;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th,td{
    padding:13px 10px;
    border-bottom:1px solid #edf0f4;
    text-align:right;
}

th{
    background:#f8fafc;
}

.actions button{
    margin-left:5px;
    padding:7px 10px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
}

.edit{
    background:#e7f5ff;
    color:#1971c2;
}

.delete{
    background:#fff0f0;
    color:#c92a2a;
}

.empty{
    text-align:center;
    padding:35px;
    color:#777;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-box{
    background:white;
    width:100%;
    max-width:520px;
    border-radius:16px;
    padding:22px;
    max-height:90vh;
    overflow:auto;
}

.modal-box h2{
    margin-top:0;
}

input{
    width:100%;
    padding:12px;
    margin:6px 0 12px;
    border:1px solid #d8dee9;
    border-radius:9px;
    font-family:inherit;
    font-size:15px;
}

label{
    font-size:14px;
    font-weight:bold;
}

.form-buttons{
    display:flex;
    gap:10px;
    margin-top:8px;
}

.save{
    background:#ea580c;
    color:white;
    flex:1;
}

.cancel{
    background:#e9ecef;
    color:#333;
    flex:1;
}

.form-buttons button{
    border:0;
    padding:13px;
    border-radius:9px;
    cursor:pointer;
    font-family:inherit;
    font-weight:bold;
}

.error{
    display:none;
    background:#fff5f5;
    color:#c92a2a;
    border:1px solid #ffc9c9;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
    white-space:pre-wrap;
    word-break:break-word;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="container">
        <h1>احمدزي ښوونځی</h1>
        <p>د صنفونو مدیریت سیستم</p>
    </div>
</div>

<div class="container">

    <div class="topbar">

        <div>
            <h2>د صنفونو مدیریت</h2>

            <div id="status" class="status">
                ډیټابیس چک کېږي...
            </div>
        </div>

        <button class="add-btn" onclick="openModal()">
            ＋ نوی صنف
        </button>

    </div>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="د صنف نوم، کوډ یا استاد ولټوئ..."
        oninput="render()"
    >

    <div class="stats">

        <div class="stat">
            ټول صنفونه
            <strong id="total">0</strong>
        </div>

        <div class="stat">
            ټول ظرفیت
            <strong id="capacity">0</strong>
        </div>

    </div>

    <div class="card">

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>کوډ</th>
                        <th>صنف</th>
                        <th>ټولګی</th>
                        <th>ظرفیت</th>
                        <th>استاد</th>
                        <th>عملیات</th>
                    </tr>
                </thead>

                <tbody id="classList">

                    <tr>
                        <td colspan="6" class="empty">
                            صنفونه لوډ کېږي...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<div class="modal" id="modal">

    <div class="modal-box">

        <h2 id="modalTitle">نوی صنف</h2>

        <input type="hidden" id="classId">

        <label>د صنف کوډ — اختیاري</label>
        <input
            id="code"
            placeholder="لکه C-001"
        >

        <label>د صنف نوم</label>
        <input
            id="name"
            placeholder="لکه A-10"
        >

        <label>ټولګی</label>
        <input
            id="grade"
            placeholder="لکه 10"
        >

        <label>ظرفیت</label>
        <input
            id="capacityInput"
            type="number"
            placeholder="لکه 30"
        >

        <label>استاد</label>
        <input
            id="teacher"
            placeholder="لکه محمد اسلم"
        >

        <div id="errorBox" class="error"></div>

        <div class="form-buttons">

            <button
                class="save"
                onclick="saveClass()">
                ذخیره کول
            </button>

            <button
                class="cancel"
                onclick="closeModal()">
                لغوه
            </button>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://oaxmnfnaqhdvnykawvyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7";

const API =
SUPABASE_URL + "/rest/v1/classes";

const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization":"Bearer " + SUPABASE_KEY,
    "Content-Type":"application/json"
};

let classes = [];


async function loadClasses(){

    try{

        const res = await fetch(
            API + "?select=*&order=id.asc",
            {
                headers
            }
        );

        const text = await res.text();

        if(!res.ok){
            throw new Error(text);
        }

        classes = JSON.parse(text);

        localStorage.setItem(
            "ahmadzai_classes",
            JSON.stringify(classes)
        );

        render();

        document.getElementById("status").textContent =
            "آنلاین";

        document.getElementById("status").className =
            "status online";

    }catch(error){

        console.error(error);

        classes = JSON.parse(
            localStorage.getItem(
                "ahmadzai_classes"
            ) || "[]"
        );

        render();

        document.getElementById("status").textContent =
            "آفلاین";

        document.getElementById("status").className =
            "status offline";
    }
}


function render(){

    const list =
        document.getElementById("classList");

    const search =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const filtered =
        classes.filter(c => {

            return (
                String(c.code || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(c.name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(c.teacher || "")
                    .toLowerCase()
                    .includes(search)
            );
        });


    document.getElementById("total").textContent =
        classes.length;

    document.getElementById("capacity").textContent =
        classes.reduce(
            (sum,c) =>
                sum + Number(c.capacity || 0),
            0
        );


    if(filtered.length === 0){

        list.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    هېڅ صنف پیدا نه شو
                </td>
            </tr>
        `;

        return;
    }


    list.innerHTML =
        filtered.map(c => `

            <tr>

                <td>${escapeHTML(c.code || "—")}</td>

                <td>
                    <strong>
                        ${escapeHTML(c.name || "—")}
                    </strong>
                </td>

                <td>${escapeHTML(c.grade || "—")}</td>

                <td>${escapeHTML(c.capacity ?? "—")}</td>

                <td>${escapeHTML(c.teacher || "—")}</td>

                <td class="actions">

                    <button
                        class="edit"
                        onclick="editClass(${c.id})">
                        سمون
                    </button>

                    <button
                        class="delete"
                        onclick="deleteClass(${c.id})">
                        حذف
                    </button>

                </td>

            </tr>

        `).join("");
}


function openModal(){

    document.getElementById("modal").style.display =
        "flex";

    document.getElementById("modalTitle").textContent =
        "نوی صنف";

    document.getElementById("classId").value = "";
    document.getElementById("code").value = "";
    document.getElementById("name").value = "";
    document.getElementById("grade").value = "";
    document.getElementById("capacityInput").value = "";
    document.getElementById("teacher").value = "";

    hideError();
}


function closeModal(){

    document.getElementById("modal").style.display =
        "none";

    hideError();
}


async function saveClass(){

    hideError();

    const id =
        document.getElementById("classId").value;

    const data = {

        code:
            document.getElementById("code")
            .value
            .trim() || null,

        name:
            document.getElementById("name")
            .value
            .trim(),

        grade:
            document.getElementById("grade")
            .value
            .trim() || null,

        capacity:
            document.getElementById("capacityInput")
            .value
            ? Number(
                document.getElementById("capacityInput")
                .value
            )
            : null,

        teacher:
            document.getElementById("teacher")
            .value
            .trim() || null
    };


    if(!data.name){

        showError(
            "د صنف نوم ضروري دی."
        );

        return;
    }


    try{

        let res;

        if(id){

            res = await fetch(
                API + "?id=eq." +
                encodeURIComponent(id),
                {
                    method:"PATCH",
                    headers:{
                        ...headers,
                        "Prefer":
                            "return=representation"
                    },
                    body:JSON.stringify(data)
                }
            );

        }else{

            res = await fetch(
                API,
                {
                    method:"POST",
                    headers:{
                        ...headers,
                        "Prefer":
                            "return=representation"
                    },
                    body:JSON.stringify(data)
                }
            );
        }


        const text = await res.text();

        if(!res.ok){

            showError(
                "Supabase خطا:\n\n" +
                text
            );

            return;
        }


        alert(
            id
            ? "صنف سم شو."
            : "صنف ثبت شو."
        );

        closeModal();

        await loadClasses();

    }catch(error){

        showError(
            "د انټرنېټ ستونزه:\n" +
            error.message
        );
    }
}


function editClass(id){

    const c =
        classes.find(
            x => String(x.id) === String(id)
        );

    if(!c) return;

    document.getElementById("modal").style.display =
        "flex";

    document.getElementById("modalTitle").textContent =
        "د صنف سمون";

    document.getElementById("classId").value =
        c.id;

    document.getElementById("code").value =
        c.code || "";

    document.getElementById("name").value =
        c.name || "";

    document.getElementById("grade").value =
        c.grade || "";

    document.getElementById("capacityInput").value =
        c.capacity ?? "";

    document.getElementById("teacher").value =
        c.teacher || "";

    hideError();
}


async function deleteClass(id){

    if(!confirm("ایا دا صنف حذف کول غواړئ؟")){
        return;
    }

    try{

        const res = await fetch(
            API + "?id=eq." +
            encodeURIComponent(id),
            {
                method:"DELETE",
                headers
            }
        );

        const text = await res.text();

        if(!res.ok){

            alert(
                "حذف ناکام شو:\n" +
                text
            );

            return;
        }

        alert("صنف حذف شو.");

        await loadClasses();

    }catch(error){

        alert(
            "د حذف ستونزه:\n" +
            error.message
        );
    }
}


function showError(message){

    const box =
        document.getElementById("errorBox");

    box.textContent = message;
    box.style.display = "block";
}


function hideError(){

    document.getElementById("errorBox")
        .style.display = "none";
}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


loadClasses();

</script>

</body>
</html>
