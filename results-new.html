<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احمدزي ښوونځی - د ازموینو پایلې</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f7f6;color:#20312b}
header{background:#176b55;color:white;padding:20px;text-align:center}
header h2{margin:0}
main{max-width:1100px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;margin-bottom:18px;border-radius:14px;box-shadow:0 3px 12px #0000000d}
h3{color:#176b55;margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:5px}
input,select{width:100%;padding:11px;border:1px solid #ccd9d2;border-radius:8px;font:inherit;background:white}
button{padding:11px 16px;border:0;border-radius:8px;background:#176b55;color:white;font:inherit;cursor:pointer;margin:5px 0}
button.secondary{background:#e5f1eb;color:#176b55}
.status{padding:10px;border-radius:8px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.error{background:#fff0ee;color:#a32118}
.success{background:#e8f8ee;color:#176b42}
.info{background:#edf5ff;color:#174b83}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px;margin-top:12px}
th,td{padding:9px;border-bottom:1px solid #e0e8e3;text-align:right}
th{background:#eaf3ee;color:#176b55}
td input{min-width:75px;padding:7px}
.small{font-size:12px;color:#68766f}
@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:8px}.card{padding:12px}}
</style>
</head>

<body>

<header>
<h2>احمدزي ښوونځی</h2>
<div>د ازموینو د نمرو ثبت او راپور</div>
</header>

<main>

<section class="card">
<h3>د ازموینې معلومات</h3>

<div class="grid">

<div>
<label for="classSelect">ټولګی</label>
<select id="classSelect">
<option value="">ټولګي بارېږي...</option>
</select>
</div>

<div>
<label for="subjectSelect">مضمون</label>
<select id="subjectSelect" disabled>
<option value="">لومړی ټولګی وټاکئ</option>
</select>
</div>

<div>
<label for="examName">د ازموینې ډول</label>
<select id="examName" required>
<option value="څلور نیم‌میاشتنۍ ازموینه">څلور نیم‌میاشتنۍ ازموینه</option>
<option value="کلنۍ ازموینه">کلنۍ ازموینه</option>
</select>
</div>

<div>
<label for="examDate">د ازموینې نېټه</label>
<input type="date" id="examDate" required>
</div>

<div>
<label for="totalMarks">د ټولو نمرو مجموعه</label>
<input type="number" id="totalMarks" min="1" value="100" required>
</div>

</div>

<div id="status"></div>

<button type="button" id="loadStudentsBtn">زده‌کوونکي ښکاره کړئ</button>
<button type="button" class="secondary" id="refreshBtn">بیا تازه کول</button>
</section>

<section class="card">
<h3>د زده‌کوونکو نمرې</h3>
<div class="small">نمرې ولیکئ؛ فیصدي او درجه به په اتومات ډول محاسبه شي.</div>

<div id="studentsArea">لومړی ټولګی او مضمون وټاکئ.</div>

<button type="button" id="saveBtn">نمرې خوندي کړئ</button>
</section>

<section class="card">
<h3>د ثبت شویو پایلو تاریخچه</h3>

<div class="grid">
<div>
<label for="historyClass">ټولګی</label>
<select id="historyClass">
<option value="">ټول ټولګي</option>
</select>
</div>

<div>
<label for="historyExam">د ازموینې ډول</label>
<select id="historyExam">
<option value="">ټولې ازموینې</option>
<option value="څلور نیم‌میاشتنۍ ازموینه">څلور نیم‌میاشتنۍ ازموینه</option>
<option value="کلنۍ ازموینه">کلنۍ ازموینه</option>
</select>
</div>
</div>

<button type="button" class="secondary" id="historyBtn">تاریخچه وښایئ</button>

<div id="historyArea">د پایلو د لیدلو لپاره تڼۍ کېکاږئ.</div>
</section>

</main>

<script>
'use strict';

/* د Supabase تنظیمات */
const SUPABASE_URL = 'https://oaxmnfnaqhdvnykawvyh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7';

const API = SUPABASE_URL + '/rest/v1/';

const EXAM_TYPES = [
    'څلور نیم‌میاشتنۍ ازموینه',
    'کلنۍ ازموینه'
];

const $ = id => document.getElementById(id);

let classesData = [];
let subjectsData = [];
let studentsData = [];

function showStatus(message, type='info') {
    const box = $('status');
    box.className = 'status ' + type;
    box.textContent = message;
}

function clearStatus() {
    $('status').textContent = '';
    $('status').className = '';
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
    })[char]);
}

async function apiRequest(path, options={}) {
    const headers = {
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + SUPABASE_KEY,
        Accept: 'application/json',
        ...(options.headers || {})
    };

    if (options.body && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
    }

    const response = await fetch(API + path, {
        ...options,
        headers
    });

    const text = await response.text();

    let data = null;

    try {
        data = text ? JSON.parse(text) : null;
    } catch (_) {
        data = text;
    }

    if (!response.ok) {
        const message = data && typeof data === 'object'
            ? (data.message || data.details || JSON.stringify(data))
            : String(data || response.statusText);

        throw new Error('HTTP ' + response.status + ': ' + message);
    }

    return data;
}

function fillSelect(select, items, placeholder, valueFn, labelFn) {
    select.innerHTML = '';

    const first = document.createElement('option');
    first.value = '';
    first.textContent = placeholder;
    select.appendChild(first);

    items.forEach(item => {
        const option = document.createElement('option');
        option.value = valueFn(item);
        option.textContent = labelFn(item);
        select.appendChild(option);
    });
}

/* ټولګي لوستل */
async function loadClasses() {
    const select = $('classSelect');

    select.innerHTML = '<option value="">ټولګي بارېږي...</option>';

    try {
        classesData = await apiRequest(
            'classes?select=code,name,grade&order=code.asc'
        );

        classesData = (classesData || []).filter(
            item => item.name || item.code
        );

        fillSelect(
            select,
            classesData,
            'ټولګی وټاکئ',
            item => item.name || item.code,
            item => item.name || item.code
        );

        fillSelect(
            $('historyClass'),
            classesData,
            'ټول ټولګي',
            item => item.name || item.code,
            item => item.name || item.code
        );

        if (!classesData.length) {
            showStatus('په ډیټابېس کې ټولګي ونه موندل شول.', 'error');
        }

    } catch (error) {
        select.innerHTML = '<option value="">ستونزه</option>';
        showStatus('د ټولګیو د لوستلو ستونزه:\n' + error.message, 'error');
    }
}

/* مضمونونه لوستل */
async function loadSubjects() {
    try {
        subjectsData = await apiRequest(
            'subjects?select=code,name,class&order=code.asc'
        );

        subjectsData = subjectsData || [];
        filterSubjects();

    } catch (error) {
        $('subjectSelect').innerHTML =
            '<option value="">مضمونونه ونه لوستل شول</option>';

        showStatus('د مضمونونو ستونزه:\n' + error.message, 'error');
    }
}

/* د ټولګي مطابق مضمونونه */
function filterSubjects() {
    const className = $('classSelect').value;
    const select = $('subjectSelect');

    if (!className) {
        select.disabled = true;

        fillSelect(
            select,
            [],
            'لومړی ټولګی وټاکئ',
            () => '',
            () => ''
        );

        return;
    }

    const matched = subjectsData.filter(item =>
        !item.class || String(item.class).trim() === className
    );

    const available = matched.length ? matched : subjectsData;

    fillSelect(
        select,
        available,
        'مضمون وټاکئ',
        item => item.name || item.code,
        item => {
            let label = item.name || item.code || 'بې‌نومه مضمون';

            if (item.class && String(item.class).trim() !== className) {
                label += ' (' + item.class + ')';
            }

            return label;
        }
    );

    select.disabled = available.length === 0;

    if (!available.length) {
        showStatus('په ډیټابېس کې مضمون ونه موندل شو.', 'error');
    }
}

/* د نمرو درجه */
function getGrade(percentage) {
    if (percentage >= 90) return 'A';
    if (percentage >= 80) return 'B';
    if (percentage >= 70) return 'C';
    if (percentage >= 60) return 'D';
    if (percentage >= 40) return 'E';
    return 'F';
}

/* د نمرو فیصدي */
function calculatePercentage(input) {
    const marks = Number(input.value);
    const total = Number($('totalMarks').value);

    const row = input.closest('tr');

    if (!row) return;

    const percentageCell = row.querySelector('.percentage');
    const gradeCell = row.querySelector('.grade');

    if (
        input.value === '' ||
        !Number.isFinite(marks) ||
        !Number.isFinite(total) ||
        total <= 0
    ) {
        percentageCell.textContent = '-';
        gradeCell.textContent = '-';
        return;
    }

    if (marks < 0 || marks > total) {
        percentageCell.textContent = 'ناسمې نمرې';
        gradeCell.textContent = '-';
        return;
    }

    const percentage = (marks / total) * 100;

    percentageCell.textContent = percentage.toFixed(2) + '%';
    gradeCell.textContent = getGrade(percentage);
}

/* زده‌کوونکي لوستل */
async function loadStudents() {
    clearStatus();

    const className = $('classSelect').value;
    const subject = $('subjectSelect').value;

    if (!className) {
        showStatus('مهرباني وکړئ ټولګی وټاکئ.', 'error');
        return;
    }

    if (!subject) {
        showStatus('مهرباني وکړئ مضمون وټاکئ.', 'error');
        return;
    }

    $('studentsArea').textContent = 'زده‌کوونکي بارېږي...';

    try {
        const path =
            'students?select=id,code,name,father,class' +
            '&class=eq.' + encodeURIComponent(className) +
            '&order=id.asc';

        studentsData = await apiRequest(path);
        studentsData = studentsData || [];

        renderStudents();

        if (!studentsData.length) {
            showStatus(
                'په ' + className + ' ټولګي کې زده‌کوونکي ونه موندل شول. د students جدول د class ارزښت وګورئ.',
                'error'
            );
        } else {
            showStatus(
                'ټول ' + studentsData.length + ' زده‌کوونکي وموندل شول.',
                'success'
            );
        }

    } catch (error) {
        $('studentsArea').textContent = 'زده‌کوونکي ونه لوستل شول.';
        showStatus('د زده‌کوونکو ستونزه:\n' + error.message, 'error');
    }
}

/* د زده‌کوونکو جدول */
function renderStudents() {
    const area = $('studentsArea');

    if (!studentsData.length) {
        area.innerHTML = '<div>زده‌کوونکي ونه موندل شول.</div>';
        return;
    }

    let html = `
    <div class="table-wrap">
    <table>
    <thead>
    <tr>
        <th>شمېره</th>
        <th>د زده‌کوونکي نوم</th>
        <th>د پلار نوم</th>
        <th>نمرې</th>
        <th>فیصدي</th>
        <th>درجه</th>
    </tr>
    </thead>
    <tbody>
    `;

    studentsData.forEach((student, index) => {
        html += `
        <tr data-student-id="${escapeHtml(student.id)}"
            data-student-name="${escapeHtml(student.name || '')}">
            <td>${index + 1}</td>
            <td>
                <strong>${escapeHtml(student.name || '')}</strong>
                <div class="small">${escapeHtml(student.code || '')}</div>
            </td>
            <td>${escapeHtml(student.father || '')}</td>
            <td>
                <input class="marks"
                    type="number"
                    min="0"
                    max="${Number($('totalMarks').value) || 100}"
                    step="0.5"
                    placeholder="نمرې"
                    aria-label="د زده‌کوونکي نمرې"
                    oninput="calculatePercentage(this)">
            </td>
            <td class="percentage">-</td>
            <td class="grade">-</td>
        </tr>
        `;
    });

    html += '</tbody></table></div>';

    area.innerHTML = html;
}

/* نمرې خوندي کول */
async function saveResults() {
    clearStatus();

    const className = $('classSelect').value;
    const subject = $('subjectSelect').value;
    const examName = $('examName').value;
    const examDate = $('examDate').value;
    const total = Number($('totalMarks').value);

    if (!className || !subject) {
        showStatus('ټولګی او مضمون وټاکئ.', 'error');
        return;
    }

    if (!EXAM_TYPES.includes(examName)) {
        showStatus('د ازموینې ډول ناسم دی.', 'error');
        return;
    }

    if (!examDate) {
        showStatus('د ازموینې نېټه وټاکئ.', 'error');
        return;
    }

    if (!Number.isFinite(total) || total <= 0) {
        showStatus('د ټولو نمرو مجموعه باید له صفر څخه زیاته وي.', 'error');
        return;
    }

    const rows = Array.from(
        document.querySelectorAll('#studentsArea tbody tr')
    );

    if (!rows.length) {
        showStatus('لومړی زده‌کوونکي ښکاره کړئ.', 'error');
        return;
    }

    const records = [];

    for (const row of rows) {
        const input = row.querySelector('.marks');

        if (input.value === '') {
            continue;
        }

        const marks = Number(input.value);

        if (!Number.isFinite(marks) || marks < 0 || marks > total) {
            showStatus(
                'د ' + row.dataset.studentName +
                ' نمرې ناسمې دي. نمرې باید د ۰ او ' + total + ' ترمنځ وي.',
                'error'
            );
            return;
        }

        const percentage = Number(((marks / total) * 100).toFixed(2));

        records.push({
            student_id: Number(row.dataset.studentId),
            class: className,
            subject: subject,
            exam_name: examName,
            exam_date: examDate,
            marks: marks,
            total_marks: total,
            percentage: percentage,
            grade: getGrade(percentage)
        });
    }

    if (!records.length) {
        showStatus('لږ تر لږه د یوه زده‌کوونکي نمرې ولیکئ.', 'error');
        return;
    }

    const button = $('saveBtn');
    button.disabled = true;
    button.textContent = 'نمرې خوندي کېږي...';

    try {
        /*
         * د موجودې پایلې لټون؛ که موجوده وي، تازه کېږي.
         * که نه وي، نوې پایله ثبتېږي.
         */
        let saved = 0;

        for (const record of records) {
            const lookup =
                'results?select=id' +
                '&student_id=eq.' + encodeURIComponent(record.student_id) +
                '&class=eq.' + encodeURIComponent(record.class) +
                '&subject=eq.' + encodeURIComponent(record.subject) +
                '&exam_name=eq.' + encodeURIComponent(record.exam_name) +
                '&exam_date=eq.' + encodeURIComponent(record.exam_date);

            const existing = await apiRequest(lookup);

            if (existing && existing.length) {
                const id = existing[0].id;

                await apiRequest(
                    'results?id=eq.' + encodeURIComponent(id),
                    {
                        method: 'PATCH',
                        headers: {'Prefer':'return=minimal'},
                        body: JSON.stringify(record)
                    }
                );
            } else {
                await apiRequest('results', {
                    method: 'POST',
                    headers: {'Prefer':'return=minimal'},
                    body: JSON.stringify(record)
                });
            }

            saved++;
        }

        showStatus(
            'بریالي شو! د ' + saved + ' زده‌کوونکو پایلې ثبت یا تازه شوې.',
            'success'
        );

        await loadHistory();

    } catch (error) {
        showStatus(
            'د پایلو د خوندي کولو ستونزه:\n' + error.message +
            '\nکه د id ستونزه وي، د results جدول د id د اتومات تولید تنظیم وګورئ.',
            'error'
        );
    } finally {
        button.disabled = false;
        button.textContent = 'نمرې خوندي کړئ';
    }
}

/* د پایلو تاریخچه */
async function loadHistory() {
    const area = $('historyArea');
    area.textContent = 'تاریخچه بارېږي...';

    try {
        let path =
            'results?select=id,student_id,class,subject,exam_name,exam_date,marks,total_marks,percentage,grade&order=exam_date.desc';

        const className = $('historyClass').value;
        const examName = $('historyExam').value;

        if (className) {
            path += '&class=eq.' + encodeURIComponent(className);
        }

        if (examName) {
            if (!EXAM_TYPES.includes(examName)) {
                throw new Error('د ازموینې ډول ناسم دی.');
            }

            path += '&exam_name=eq.' + encodeURIComponent(examName);
        } else {
            path += '&exam_name=in.(' +
                EXAM_TYPES.map(encodeURIComponent).join(',') + ')';
        }

        const results = await apiRequest(path);

        if (!results || !results.length) {
            area.innerHTML = '<div>د ټاکلو شرایطو مطابق پایلې ونه موندل شوې.</div>';
            return;
        }

        let html = `
        <div class="table-wrap">
        <table>
        <thead>
        <tr>
            <th>زده‌کوونکی ID</th>
            <th>ټولګی</th>
            <th>مضمون</th>
            <th>ازموینه</th>
            <th>نېټه</th>
            <th>نمرې</th>
            <th>فیصدي</th>
            <th>درجه</th>
        </tr>
        </thead>
        <tbody>
        `;

        results.forEach(item => {
            html += `
            <tr>
                <td>${escapeHtml(item.student_id)}</td>
                <td>${escapeHtml(item.class)}</td>
                <td>${escapeHtml(item.subject)}</td>
                <td>${escapeHtml(item.exam_name)}</td>
                <td>${escapeHtml(item.exam_date)}</td>
                <td>${escapeHtml(item.marks)} / ${escapeHtml(item.total_marks)}</td>
                <td>${escapeHtml(item.percentage)}%</td>
                <td>${escapeHtml(item.grade)}</td>
            </tr>
            `;
        });

        html += '</tbody></table></div>';

        area.innerHTML = html;

    } catch (error) {
        area.textContent = 'د تاریخچې ستونزه: ' + error.message;
    }
}

/* د پاڼې تڼۍ */
$('classSelect').addEventListener('change', () => {
    filterSubjects();
    $('studentsArea').textContent = 'د زده‌کوونکو د لیدلو لپاره تڼۍ کېکاږئ.';
});

$('loadStudentsBtn').addEventListener('click', loadStudents);
$('refreshBtn').addEventListener('click', async () => {
    clearStatus();
    await loadClasses();
    await loadSubjects();
});
$('saveBtn').addEventListener('click', saveResults);
$('historyBtn').addEventListener('click', loadHistory);

$('totalMarks').addEventListener('input', () => {
    document.querySelectorAll('.marks').forEach(input => {
        input.max = Number($('totalMarks').value) || 100;
        calculatePercentage(input);
    });
});

/* پیل */
(async function init() {
    $('examDate').value = new Date().toISOString().slice(0, 10);
    await loadClasses();
    await loadSubjects();
})();
</script>

</body>
</html>
