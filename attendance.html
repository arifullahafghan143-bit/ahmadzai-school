<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>د زده‌کوونکو حاضري | احمدزي ښوونځی</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f8fbff);
  color:#172033;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.header{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  padding:24px;
  border-radius:20px;
  margin-bottom:20px;
  box-shadow:0 10px 30px #2563eb30;
}

.header h1{
  margin:0 0 8px;
  font-size:25px;
}

.header p{
  margin:0;
  opacity:.9;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 8px 25px #0000000d;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #d7deea;
  border-radius:12px;
  font-size:15px;
  background:white;
  font-family:inherit;
}

input:focus,select:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 3px #2563eb18;
}

.supervisor{
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  background:#eff6ff;
  color:#1d4ed8;
  line-height:1.9;
}

.students{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.student{
  border:1px solid #e1e7f0;
  border-radius:15px;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.student-info strong{
  display:block;
  font-size:17px;
  margin-bottom:5px;
}

.student-info span{
  color:#64748b;
  font-size:13px;
}

.buttons{
  display:flex;
  gap:7px;
}

.status-btn{
  border:0;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  font-family:inherit;
}

.present{
  background:#dcfce7;
  color:#166534;
}

.absent{
  background:#fee2e2;
  color:#991b1b;
}

.late{
  background:#fef3c7;
  color:#92400e;
}

.status-btn.active{
  outline:3px solid #2563eb35;
  transform:scale(1.03);
}

.save{
  width:100%;
  border:0;
  background:#2563eb;
  color:white;
  padding:15px;
  border-radius:13px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
  font-family:inherit;
}

.save:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  padding:13px;
  border-radius:12px;
  margin-top:15px;
  display:none;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.8;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.count{
  color:#2563eb;
  font-weight:bold;
  margin-bottom:12px;
  line-height:2;
}

.loading{
  color:#64748b;
}

@media(max-width:700px){
  .grid{grid-template-columns:1fr}

  .student{
    flex-direction:column;
    align-items:stretch;
  }

  .buttons{width:100%}

  .status-btn{flex:1}

  .container{padding:12px}

  .header h1{font-size:21px}
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📋 د زده‌کوونکو حاضري</h1>
    <p>احمدزي ښوونځی — د ټول صنف حاضري</p>
  </div>

  <div class="card">

    <div class="grid">

      <div>
        <label for="date">📅 د حاضري نېټه</label>
        <input type="date" id="date">
      </div>

      <div>
        <label for="classSelect">🏫 صنف انتخاب کړئ</label>
        <select id="classSelect">
          <option value="">صنف انتخاب کړئ</option>
        </select>
      </div>

    </div>

    <div id="supervisor" class="supervisor">
      👨‍🏫 د صنف نګران استاد به دلته ښکاره شي.
    </div>

  </div>

  <div class="card">

    <h3>👨‍🎓 د صنف د زده‌کوونکو حاضري</h3>

    <div id="count" class="count"></div>

    <div id="students" class="students">
      <p class="loading">معلومات لوډ کېږي...</p>
    </div>

    <button
      class="save"
      id="saveButton"
      onclick="saveAttendance()">
      💾 د ټول صنف حاضري ثبت کړئ
    </button>

    <div id="message" class="message"></div>

  </div>

</div>

<script>
"use strict";

/* =========================
   SUPABASE SETTINGS
========================= */

const SUPABASE_URL =
"https://oaxmnfnaqhdvnykawvyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7";

const CLASS_API =
`${SUPABASE_URL}/rest/v1/classes`;

const STUDENT_API =
`${SUPABASE_URL}/rest/v1/students`;

const ATTENDANCE_API =
`${SUPABASE_URL}/rest/v1/attendance`;

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": `Bearer ${SUPABASE_KEY}`,
  "Content-Type": "application/json"
};

let classes = [];
let students = [];
let attendanceColumns = new Set();

/*
  د attendance جدول دوه‌ګوني کالمونه لري.
  د جدول جوړښت په اتومات ډول لوستل کېږي.
*/

/* =========================
   ELEMENTS
========================= */

const dateInput = document.getElementById("date");
const classSelect = document.getElementById("classSelect");
const studentsDiv = document.getElementById("students");
const countDiv = document.getElementById("count");
const supervisorDiv = document.getElementById("supervisor");
const messageDiv = document.getElementById("message");
const saveButton = document.getElementById("saveButton");

/* =========================
   LOCAL DATE
========================= */

function getLocalDate(){
  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth()+1).padStart(2,"0");
  const day = String(now.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;
}

dateInput.value = getLocalDate();

/* =========================
   API HELPERS
========================= */

async function apiFetch(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    headers: {
      ...headers,
      ...(options.headers || {})
    }
  });

  const text = await response.text();

  if (!response.ok) {
    throw new Error(text || `HTTP ${response.status}`);
  }

  if (!text.trim()) {
    return [];
  }

  try {
    return JSON.parse(text);
  } catch {
    return [];
  }
}

function quoteFilter(value){
  /*
    PostgREST د text filter لپاره.
    د عامو صنفونو نومونه لکه A-10 پکې خوندي دي.
  */
  return String(value).replace(/[%_]/g, "\\$&");
}

/* =========================
   LOAD ATTENDANCE SCHEMA
========================= */

async function loadAttendanceSchema(){
  /*
    د صفر قطارونو غوښتنه یوازې د کالمونو
    نومونه ترلاسه کوي؛ معلومات نه بدلوي.
  */
  const response = await fetch(
    `${ATTENDANCE_API}?select=*`,
    {headers}
  );

  if (!response.ok) {
    throw new Error(
      "د حاضري جدول نه شو لوستلای:\n" +
      await response.text()
    );
  }

  /*
    PostgREST په خالي جدول کې د کالمونو
    نومونه د JSON له لارې نه ښيي.
    نو د موجودې حاضري یو ریکارډ هم لوستلی شو.
  */
  const rows = await response.json();

  if (rows.length) {
    attendanceColumns = new Set(
      Object.keys(rows[0])
    );
    return;
  }

  /*
    که جدول خالي وي، د معلومو کالمونو
    لېست د اوسني schema له مخې کاروو.
  */
  attendanceColumns = new Set([
    "id",
    "Date",
    "Student ID",
    "Class",
    "Subject",
    "Status",
    "date",
    "student_id",
    "class",
    "subject",
    "status"
  ]);
}

/* =========================
   LOAD CLASSES
========================= */

async function loadClasses(){
  const rows = await apiFetch(
    `${CLASS_API}?select=id,code,name,grade,capacity,teacher&order=id.asc`
  );

  classes = rows;

  classSelect.innerHTML =
    '<option value="">صنف انتخاب کړئ</option>';

  classes.forEach(item => {
    const name = String(item.name || "").trim();
    const code = String(item.code || "").trim();

    if (!name && !code) return;

    const option = document.createElement("option");

    option.value = name || code;
    option.textContent = code
      ? `${code} - ${name}`
      : name;

    option.dataset.name = name || code;
    option.dataset.teacher = String(item.teacher || "").trim();
    option.dataset.code = code;

    classSelect.appendChild(option);
  });
}

/* =========================
   LOAD STUDENTS
========================= */

async function loadStudents(){
  /*
    د اضافي gender/address کالمونو غوښتنه نه کوو،
    ځکه د جدول په schema کې یې شتون تایید شوی نه دی.
  */
  students = await apiFetch(
    `${STUDENT_API}?select=id,code,name,father,class&order=id.asc`
  );
}

/* =========================
   SELECTED CLASS
========================= */

function getSelectedClass(){
  const option =
    classSelect.options[classSelect.selectedIndex];

  if (!option || !option.value) return null;

  return {
    name: String(option.dataset.name || option.value).trim(),
    code: String(option.dataset.code || "").trim(),
    teacher: String(option.dataset.teacher || "").trim()
  };
}

/* =========================
   SHOW STUDENTS
========================= */

async function showStudents(){
  clearMessage();

  const selected = getSelectedClass();

  if (!selected) {
    studentsDiv.innerHTML =
      "<p>لومړی صنف انتخاب کړئ.</p>";

    countDiv.textContent = "";
    supervisorDiv.textContent =
      "👨‍🏫 د صنف نګران استاد به دلته ښکاره شي.";

    return;
  }

  supervisorDiv.textContent = selected.teacher
    ? `👨‍🏫 نګران استاد: ${selected.teacher}`
    : "⚠️ د دې صنف لپاره نګران استاد نه دی ټاکل شوی.";

  studentsDiv.innerHTML =
    '<p class="loading">زده‌کوونکي لوډ کېږي...</p>';

  try {
    const className = selected.name;
    const classCode = selected.code;

    const filtered = students.filter(student => {
      const studentClass =
        String(student.class || "").trim();

      return (
        studentClass === className ||
        (classCode && studentClass === classCode)
      );
    });

    if (!filtered.length) {
      countDiv.textContent = "۰ زده‌کوونکي";

      studentsDiv.innerHTML = `
        <p>
          په "${escapeHtml(className)}" کې زده‌کوونکي پیدا نه شول.
          د students جدول کې د class کالم ارزښت وګورئ.
        </p>
      `;

      return;
    }

    /*
      د ټاکل شوې نېټې موجوده حاضري ولولئ،
      څو د اصلاح پر وخت پخواني حالتونه وساتل شي.
    */
    const existing = await loadExistingAttendance(
      dateInput.value,
      className
    );

    studentsDiv.innerHTML = "";

    filtered.forEach(student => {
      const oldRecord = existing.find(row =>
        String(row.student_id ?? row["Student ID"] ?? "") ===
        String(student.id)
      );

      const oldStatus = oldRecord
        ? String(oldRecord.status ?? oldRecord.Status ?? "حاضر")
        : "حاضر";

      const div = document.createElement("div");

      div.className = "student";
      div.dataset.studentId = student.id;
      div.dataset.status = oldStatus;

      div.innerHTML = `
        <div class="student-info">
          <strong>${escapeHtml(student.name || "بې‌نومه")}</strong>
          <span>
            کوډ: ${escapeHtml(student.code || "—")}
            | د پلار نوم: ${escapeHtml(student.father || "—")}
          </span>
        </div>

        <div class="buttons">
          <button type="button"
            class="status-btn present"
            onclick="setStatus(this,'حاضر')">حاضر</button>

          <button type="button"
            class="status-btn absent"
            onclick="setStatus(this,'غیرحاضر')">غیرحاضر</button>

          <button type="button"
            class="status-btn late"
            onclick="setStatus(this,'ناوخته')">ناوخته</button>
        </div>
      `;

      studentsDiv.appendChild(div);

      const button = [...div.querySelectorAll(".status-btn")]
        .find(btn => btn.textContent.trim() === oldStatus);

      if (button) {
        button.classList.add("active");
      } else {
        div.dataset.status = "حاضر";
        div.querySelector(".present").classList.add("active");
      }
    });

    countDiv.textContent =
      `ټول زده‌کوونکي: ${filtered.length}` +
      (existing.length
        ? ` | د دې نېټې پخوانۍ حاضري: ${existing.length}`
        : "");

  } catch (error) {
    console.error(error);

    studentsDiv.innerHTML =
      "<p>د زده‌کوونکو یا پخوانۍ حاضري په لوستلو کې ستونزه رامنځته شوه.</p>";

    showMessage(error.message, "error");
  }
}

/* =========================
   READ EXISTING ATTENDANCE
========================= */

async function loadExistingAttendance(date, className){
  /*
    دواړه د نېټې او صنف احتمالي کالمونه
    د schema له مخې هڅه کېږي.
  */
  const dateColumn = attendanceColumns.has("date")
    ? "date"
    : "Date";

  const classColumn = attendanceColumns.has("class")
    ? "class"
    : "Class";

  const url =
    `${ATTENDANCE_API}?select=*&` +
    `${encodeURIComponent(dateColumn)}=eq.${encodeURIComponent(date)}&` +
    `${encodeURIComponent(classColumn)}=eq.${encodeURIComponent(className)}`;

  try {
    return await apiFetch(url);
  } catch (error) {
    console.error("Existing attendance:", error);
    throw new Error(
      "د پخوانۍ حاضري لوستل ناکام شول. معلومات نه دي بدل شوي.\n" +
      error.message
    );
  }
}

/* =========================
   SET STATUS
========================= */

function setStatus(button, status){
  const parent = button.parentElement;

  parent.querySelectorAll(".status-btn")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  button.closest(".student").dataset.status = status;
}

/* =========================
   SAVE / UPDATE ATTENDANCE
========================= */

async function saveAttendance(){
  clearMessage();

  const date = dateInput.value;
  const selected = getSelectedClass();

  if (!date) {
    showMessage("مهرباني وکړئ نېټه انتخاب کړئ.", "error");
    return;
  }

  if (!selected) {
    showMessage("مهرباني وکړئ صنف انتخاب کړئ.", "error");
    return;
  }

  const rows = [...document.querySelectorAll("#students .student")];

  if (!rows.length) {
    showMessage("د ثبت لپاره زده‌کوونکي نشته.", "error");
    return;
  }

  /*
    لومړی ټول معلومات جوړوو.
    مضمون په هېڅ ریکارډ کې نه ټاکل کېږي.
  */
  const dateColumn = attendanceColumns.has("date")
    ? "date"
    : "Date";

  const studentColumn = attendanceColumns.has("student_id")
    ? "student_id"
    : "Student ID";

  const classColumn = attendanceColumns.has("class")
    ? "class"
    : "Class";

  const statusColumn = attendanceColumns.has("status")
    ? "status"
    : "Status";

  const data = rows.map(row => {
    const record = {};

    record[dateColumn] = date;
    record[studentColumn] = Number(row.dataset.studentId);
    record[classColumn] = selected.name;
    record[statusColumn] = row.dataset.status || "حاضر";

    return record;
  });

  saveButton.disabled = true;
  saveButton.textContent = "حاضري ثبتېږي...";

  try {
    /*
      د موجودو ریکارډونو پېژندنه.
      د پخوانۍ حاضري حذف نه کېږي.
      که ریکارډ موجود وي، PATCH کېږي.
      که نه وي، POST کېږي.
    */
    const existing = await loadExistingAttendance(
      date,
      selected.name
    );

    const existingByStudent = new Map();

    existing.forEach(record => {
      const sid = record.student_id ?? record["Student ID"];

      if (sid !== null && sid !== undefined) {
        existingByStudent.set(String(sid), record);
      }
    });

    const toInsert = [];
    const updates = [];

    data.forEach(record => {
      const sid = String(record[studentColumn]);
      const oldRecord = existingByStudent.get(sid);

      if (oldRecord && oldRecord.id !== undefined) {
        updates.push({
          id: oldRecord.id,
          data: record
        });
      } else {
        toInsert.push(record);
      }
    });

    /*
      موجود ریکارډونه یو په یو تازه کېږي،
      څو د څو زده‌کوونکو معلومات یوځای غلط نه شي.
    */
    for (const item of updates) {
      const response = await fetch(
        `${ATTENDANCE_API}?id=eq.${encodeURIComponent(item.id)}`,
        {
          method: "PATCH",
          headers: {
            ...headers,
            "Prefer": "return=representation"
          },
          body: JSON.stringify(item.data)
        }
      );

      if (!response.ok) {
        throw new Error(
          "د پخوانۍ حاضري تازه کول ناکام شول:\n" +
          await response.text()
        );
      }
    }

    if (toInsert.length) {
      const response = await fetch(
        ATTENDANCE_API,
        {
          method: "POST",
          headers: {
            ...headers,
            "Prefer": "return=representation"
          },
          body: JSON.stringify(toInsert)
        }
      );

      if (!response.ok) {
        throw new Error(
          "د نوې حاضري ثبت ناکام شو:\n" +
          await response.text()
        );
      }
    }

    showMessage(
      `✅ حاضري ثبت/تازه شوه.\n` +
      `صنف: ${selected.name}\n` +
      `نېټه: ${date}\n` +
      `زده‌کوونکي: ${rows.length}\n` +
      `نوي ریکارډونه: ${toInsert.length}\n` +
      `تازه شوي ریکارډونه: ${updates.length}`,
      "success"
    );

    countDiv.textContent =
      `ټول زده‌کوونکي: ${rows.length} | حاضري ثبت شوې`;

  } catch (error) {
    console.error(error);

    showMessage(
      "❌ د حاضري ثبتولو ستونزه:\n" + error.message,
      "error"
    );

  } finally {
    saveButton.disabled = false;
    saveButton.textContent = "💾 د ټول صنف حاضري ثبت کړئ";
  }
}

/* =========================
   MESSAGES
========================= */

function showMessage(text, type){
  messageDiv.textContent = text;
  messageDiv.className = `message ${type}`;
  messageDiv.style.display = "block";
}

function clearMessage(){
  messageDiv.textContent = "";
  messageDiv.style.display = "none";
  messageDiv.className = "message";
}

/* =========================
   HTML ESCAPING
========================= */

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* =========================
   EVENTS
========================= */

classSelect.addEventListener("change", showStudents);

dateInput.addEventListener("change", () => {
  if (classSelect.value) showStudents();
});

/* =========================
   START
========================= */

async function start(){
  studentsDiv.innerHTML =
    '<p class="loading">معلومات لوډ کېږي...</p>';

  try {
    await loadAttendanceSchema();
    await Promise.all([
      loadClasses(),
      loadStudents()
    ]);
  } catch (error) {
    console.error(error);

    showMessage(
      "د معلوماتو لوډ کولو ستونزه:\n" + error.message,
      "error"
    );
  }
}

start();
</script>

</body>
</html>
