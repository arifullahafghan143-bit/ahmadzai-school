<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مضامین | احمدزي ښوونځی</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#1f2937;
}

header{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    padding:22px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

header h1{
    font-size:25px;
    margin-bottom:6px;
}

header p{
    opacity:.9;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.card h2{
    margin-bottom:18px;
    color:#1e40af;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    outline:none;
    font-size:15px;
    background:white;
}

input:focus,select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

button{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-edit{
    background:#f59e0b;
    color:white;
    margin-left:5px;
}

.btn-delete{
    background:#dc2626;
    color:white;
}

.btn-cancel{
    background:#6b7280;
    color:white;
    display:none;
}

.actions{
    margin-top:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.status{
    margin-bottom:18px;
    padding:12px;
    border-radius:10px;
    display:none;
    font-size:14px;
}

.status.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.status.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    text-align:right;
}

th{
    background:#eff6ff;
    color:#1e40af;
}

tr:hover{
    background:#f8fafc;
}

.empty{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

.loading{
    text-align:center;
    padding:20px;
    color:#2563eb;
}

@media(max-width:700px){
    .form-grid{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:21px;
    }

    .card{
        padding:16px;
    }

    button{
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 احمدزي ښوونځی</h1>
    <p>د مضامینو مدیریت</p>
</header>

<div class="container">

    <div id="status" class="status"></div>

    <div class="card">
        <h2 id="formTitle">➕ نوی مضمون ثبت کړئ</h2>

        <div class="form-grid">

            <div>
                <label>د مضمون کوډ</label>
                <input id="code" type="text" placeholder="لکه S-001">
            </div>

            <div>
                <label>د مضمون نوم</label>
                <input id="name" type="text" placeholder="لکه رياضي">
            </div>

            <div>
                <label>استاد</label>
                <select id="teacher">
                    <option value="">استاد انتخاب کړئ</option>
                </select>
            </div>

            <div>
                <label>صنف</label>
                <select id="class">
                    <option value="">صنف انتخاب کړئ</option>
                </select>
            </div>

        </div>

        <div class="actions">
            <button class="btn-primary" onclick="saveSubject()">
                💾 خوندي کول
            </button>

            <button class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">
                ❌ لغوه کول
            </button>
        </div>
    </div>


    <div class="card">
        <h2>📖 د مضامینو لېست</h2>

        <div id="loading" class="loading">
            معلومات لوډ کېږي...
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>کوډ</th>
                        <th>مضمون</th>
                        <th>استاد</th>
                        <th>صنف</th>
                        <th>عملیات</th>
                    </tr>
                </thead>

                <tbody id="subjectsTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script>

const SUPABASE_URL =
"https://oaxmnfnaqhdvnykawvyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7";

const SUBJECTS_API =
`${SUPABASE_URL}/rest/v1/subjects`;

const TEACHERS_API =
`${SUPABASE_URL}/rest/v1/teachers`;

const CLASSES_API =
`${SUPABASE_URL}/rest/v1/classes`;

const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json"
};

let subjects = [];
let editingId = null;


/* -------------------------
   پیغام
------------------------- */

function showStatus(message,type="success"){

    const box = document.getElementById("status");

    box.textContent = message;
    box.className = `status ${type}`;

    setTimeout(()=>{
        box.className = "status";
    },4000);
}


/* -------------------------
   استادان لوډ
------------------------- */

async function loadTeachers(){

    const select = document.getElementById("teacher");

    try{

        const response = await fetch(
            `${TEACHERS_API}?select=name&order=id.desc`,
            {
                headers
            }
        );

        if(!response.ok){
            throw new Error(await response.text());
        }

        const data = await response.json();

        select.innerHTML =
            `<option value="">استاد انتخاب کړئ</option>`;

        data.forEach(teacher=>{

            if(teacher.name){

                const option = document.createElement("option");

                option.value = teacher.name;
                option.textContent = teacher.name;

                select.appendChild(option);
            }

        });

    }catch(error){

        console.error(error);

        showStatus(
            "د استادانو معلومات لوډ نه شول.",
            "error"
        );
    }
}


/* -------------------------
   صنفونه لوډ
------------------------- */

async function loadClasses(){

    const select = document.getElementById("class");

    try{

        const response = await fetch(
            `${CLASSES_API}?select=name&order=id.desc`,
            {
                headers
            }
        );

        if(!response.ok){
            throw new Error(await response.text());
        }

        const data = await response.json();

        select.innerHTML =
            `<option value="">صنف انتخاب کړئ</option>`;

        data.forEach(item=>{

            if(item.name){

                const option = document.createElement("option");

                option.value = item.name;
                option.textContent = item.name;

                select.appendChild(option);
            }

        });

    }catch(error){

        console.error(error);

        showStatus(
            "د صنفونو معلومات لوډ نه شول.",
            "error"
        );
    }
}


/* -------------------------
   مضامین لوډ
------------------------- */

async function loadSubjects(){

    const loading = document.getElementById("loading");

    loading.style.display = "block";

    try{

        const response = await fetch(
            `${SUBJECTS_API}?select=*&order=id.desc`,
            {
                headers
            }
        );

        if(!response.ok){
            throw new Error(await response.text());
        }

        subjects = await response.json();

        renderSubjects();

    }catch(error){

        console.error(error);

        loading.textContent =
            "❌ د معلوماتو په لوډ کولو کې ستونزه راغله.";

        showStatus(
            "Supabase خطا: " + error.message,
            "error"
        );

        return;
    }

    loading.style.display = "none";
}


/* -------------------------
   جدول
------------------------- */

function renderSubjects(){

    const table =
        document.getElementById("subjectsTable");

    table.innerHTML = "";

    if(subjects.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    تر اوسه کوم مضمون ثبت شوی نه دی.
                </td>
            </tr>
        `;

        return;
    }

    subjects.forEach((subject,index)=>{

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>${index + 1}</td>

            <td>${escapeHTML(subject.code || "")}</td>

            <td>${escapeHTML(subject.name || "")}</td>

            <td>${escapeHTML(subject.teacher || "")}</td>

            <td>${escapeHTML(subject.class || "")}</td>

            <td>

                <button
                    class="btn-edit"
                    onclick="editSubject(${subject.id})">
                    ✏️
                </button>

                <button
                    class="btn-delete"
                    onclick="deleteSubject(${subject.id})">
                    🗑️
                </button>

            </td>
        `;

        table.appendChild(row);
    });
}


/* -------------------------
   خوندي کول
------------------------- */

async function saveSubject(){

    const code =
        document.getElementById("code").value.trim();

    const name =
        document.getElementById("name").value.trim();

    const teacher =
        document.getElementById("teacher").value;

    const className =
        document.getElementById("class").value;


    if(!code || !name){

        showStatus(
            "د مضمون کوډ او نوم حتمي دي.",
            "error"
        );

        return;
    }


    const data = {

        code: code,
        name: name,
        teacher: teacher,
        class: className
    };


    try{

        let response;


        if(editingId){

            response = await fetch(
                `${SUBJECTS_API}?id=eq.${editingId}`,
                {
                    method:"PATCH",
                    headers:{
                        ...headers,
                        "Prefer":"return=representation"
                    },
                    body:JSON.stringify(data)
                }
            );

        }else{

            response = await fetch(
                SUBJECTS_API,
                {
                    method:"POST",
                    headers:{
                        ...headers,
                        "Prefer":"return=representation"
                    },
                    body:JSON.stringify(data)
                }
            );
        }


        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(errorText);
        }


        showStatus(
            editingId
            ? "مضمون په بریالیتوب سره بدل شو. ✅"
            : "مضمون په بریالیتوب سره ثبت شو. ✅",
            "success"
        );


        clearForm();

        await loadSubjects();


    }catch(error){

        console.error(error);

        showStatus(
            "خطا: " + error.message,
            "error"
        );
    }
}


/* -------------------------
   Edit
------------------------- */

function editSubject(id){

    const subject =
        subjects.find(item => item.id === id);

    if(!subject) return;


    editingId = id;


    document.getElementById("code").value =
        subject.code || "";

    document.getElementById("name").value =
        subject.name || "";

    document.getElementById("teacher").value =
        subject.teacher || "";

    document.getElementById("class").value =
        subject.class || "";


    document.getElementById("formTitle").textContent =
        "✏️ مضمون بدل کړئ";

    document.getElementById("cancelBtn").style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* -------------------------
   لغوه
------------------------- */

function cancelEdit(){

    clearForm();
}


/* -------------------------
   فورم پاکول
------------------------- */

function clearForm(){

    editingId = null;

    document.getElementById("code").value = "";
    document.getElementById("name").value = "";

    document.getElementById("teacher").value = "";
    document.getElementById("class").value = "";

    document.getElementById("formTitle").textContent =
        "➕ نوی مضمون ثبت کړئ";

    document.getElementById("cancelBtn").style.display =
        "none";
}


/* -------------------------
   Delete
------------------------- */

async function deleteSubject(id){

    const subject =
        subjects.find(item => item.id === id);

    if(!subject) return;


    const confirmed =
        confirm(
            `ایا "${subject.name}" مضمون حذف کړئ؟`
        );

    if(!confirmed) return;


    try{

        const response = await fetch(
            `${SUBJECTS_API}?id=eq.${id}`,
            {
                method:"DELETE",
                headers
            }
        );


        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(errorText);
        }


        showStatus(
            "مضمون حذف شو. 🗑️",
            "success"
        );


        await loadSubjects();


    }catch(error){

        console.error(error);

        showStatus(
            "د حذف کولو پر مهال خطا: " +
            error.message,
            "error"
        );
    }
}


/* -------------------------
   HTML امنیت
------------------------- */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* -------------------------
   شروع
------------------------- */

async function init(){

    await Promise.all([
        loadTeachers(),
        loadClasses(),
        loadSubjects()
    ]);
}


init();

</script>

</body>
</html>
