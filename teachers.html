<!doctype html>
<html lang="ps" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>د استادانو مدیریت | احمدزي عالي لېسه</title><style>
:root{--navy:#102a43;--blue:#1769aa;--cyan:#14b8a6;--bg:#f3f7fb;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(120deg,#102a43,#1769aa);color:white;padding:22px 18px}
.wrap{max-width:1100px;margin:auto;padding:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:25px}header p{margin:8px 0 0;color:#dbeafe}
a.back{color:white;text-decoration:none;border:1px solid #ffffff77;padding:9px 13px;border-radius:10px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 6px 22px #0f172a0a}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{font-size:13px;font-weight:bold;color:#334155;display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:white}
textarea{min-height:80px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:bold;cursor:pointer;background:var(--blue);color:white}
button.secondary{background:#e2e8f0;color:#1e293b}button.danger{background:var(--red)}
.status{margin-top:12px;padding:11px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:14px}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:right;padding:12px;border-bottom:1px solid var(--line);font-size:14px}th{background:#f8fafc;color:#475569}
.smallbtn{padding:7px 10px;font-size:12px;margin:2px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f8fafc;border:1px solid var(--line);padding:12px 16px;border-radius:12px;min-width:130px}.stat b{display:block;font-size:23px;color:var(--blue)}
@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:21px}.wrap{padding:12px}.card{padding:14px}}
</style></head>
<body><header><div class="top wrap"><div><h1>👨‍🏫 د استادانو مدیریت</h1><p>احمدزي عالي لېسه · د استادانو ثبت او تنظیم</p></div><a class="back" href="index.html">← اصلي پاڼه</a></div></header>
<main class="wrap"><section class="card"><h2>د استاد معلومات</h2><form id="form"><div class="grid">
<div><label for="name">د استاد نوم *</label><input id="name" required placeholder="بشپړ نوم"></div>
<div><label for="father">د پلار نوم</label><input id="father" placeholder="د پلار نوم"></div>
<div><label for="phone">د اړیکې شمېره</label><input id="phone" type="tel" placeholder="07xxxxxxxx"></div>
<div><label for="qualification">تحصیلي درجه</label><input id="qualification" placeholder="لکه: لیسانس"></div>
<div><label for="subject">مضمون / تخصص</label><input id="subject" placeholder="د تدریس مضمون"></div>
<div><label for="address">پته</label><input id="address" placeholder="د اوسېدو پته"></div>
</div><div class="actions"><button id="save" type="submit">استاد ثبت کړه</button><button id="clear" type="button" class="secondary">فورمه پاکه کړه</button></div></form><div id="status" class="status">د ډیټابېس اتصال...</div></section>
<section class="card"><div class="top"><h2>د استادانو لېست</h2><div class="stat">ټول استادان <b id="count">0</b></div></div><label for="search">لټون</label><input id="search" placeholder="د نوم، تلیفون یا مضمون له مخې لټون"><div class="tablewrap"><table><thead><tr><th>#</th><th>نوم</th><th>د پلار نوم</th><th>تلیفون</th><th>تحصیلي درجه</th><th>مضمون</th><th>کړنې</th></tr></thead><tbody id="tbody"><tr><td colspan="7">لوډ کېږي...</td></tr></tbody></table></div></section></main><script>
const SUPABASE_URL='https://oaxmnfnaqhdvnykawvyh.supabase.co';
const SUPABASE_KEY='sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7';
const TABLE='teachers';
const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
let rows=[], editingId=null;
const $=id=>document.getElementById(id);
function msg(t,err=false){$('status').textContent=t;$('status').style.background=err?'#fef2f2':'#eff6ff';$('status').style.color=err?'#b91c1c':'#1d4ed8'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rowId(r){return r.id??r.teacher_id??r.code??null}
async function load(){msg('معلومات لوډ کېږي...');try{let res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=created_at.desc`,{headers:{...headers,'Prefer':'count=exact'}});if(!res.ok)throw Error(await res.text());rows=await res.json();render();msg(`د ${rows.length} استادانو معلومات ترلاسه شول.`)}catch(e){msg('معلومات ونه لوډ شول. د Supabase جدول او اجازې وګورئ. تفصیل: '+e.message,true)}}
function render(){const q=$('search').value.trim().toLowerCase();let list=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));$('count').textContent=rows.length;$('tbody').innerHTML=list.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name??r.full_name??r.teacher_name??'—')}</td><td>${esc(r.father_name??r.father??'—')}</td><td>${esc(r.phone??r.phone_number??'—')}</td><td>${esc(r.qualification??r.education??'—')}</td><td>${esc(r.subject??r.subject_name??'—')}</td><td><button class="smallbtn" onclick="editRow(${rows.indexOf(r)})">اصلاح</button><button class="smallbtn danger" onclick="delRow(${rows.indexOf(r)})">حذف</button></td></tr>`).join('')||'<tr><td colspan="7">معلومات نشته.</td></tr>'}
function editRow(i){let r=rows[i];editingId=rowId(r);$('name').value=r.name??r.full_name??r.teacher_name??'';$('father').value=r.father_name??r.father??'';$('phone').value=r.phone??r.phone_number??'';$('qualification').value=r.qualification??r.education??'';$('subject').value=r.subject??r.subject_name??'';$('address').value=r.address??'';$('save').textContent='بدلون خوندي کړه';window.scrollTo({top:0,behavior:'smooth'})}
async function delRow(i){let r=rows[i],id=rowId(r);if(id==null){msg('په دې ریکارډ کې id نشته؛ په خوندي ډول حذف نه شي کېدای.',true);return}if(!confirm('دا استاد حذف شي؟'))return;try{let res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(id)}`,{method:'DELETE',headers});if(!res.ok)throw Error(await res.text());msg('د حذف غوښتنه واستول شوه.');load()}catch(e){msg('حذف ناکام شو: '+e.message,true)}}
$('form').addEventListener('submit',async e=>{e.preventDefault();let payload={name:$('name').value.trim(),father_name:$('father').value.trim()||null,phone:$('phone').value.trim()||null,qualification:$('qualification').value.trim()||null,subject:$('subject').value.trim()||null,address:$('address').value.trim()||null};if(!payload.name){msg('د استاد نوم ولیکئ.',true);return}try{let url=`${SUPABASE_URL}/rest/v1/${TABLE}`;let opts={headers:{...headers,'Prefer':'return=representation'}};if(editingId!==null){opts.method='PATCH';opts.body=JSON.stringify(payload);url+=`?id=eq.${encodeURIComponent(editingId)}`}else{opts.method='POST';opts.body=JSON.stringify(payload)}let res=await fetch(url,opts);if(!res.ok)throw Error(await res.text());msg(editingId!==null?'معلومات اصلاح شول.':'استاد ثبت شو.');resetForm();load()}catch(e){msg('ثبت/اصلاح ناکام شو. د teachers جدول د کالمونو نومونه وګورئ. '+e.message,true)}});
function resetForm(){$('form').reset();editingId=null;$('save').textContent='استاد ثبت کړه'}$('clear').onclick=resetForm;$('search').addEventListener('input',render);load();
</script></body></html>
