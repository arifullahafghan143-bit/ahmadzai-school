<!DOCTYPE html><html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>د استادانو مدیریت | احمدزي عالي لېسه</title><style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Tahoma,Arial,sans-serif;
  background:#f1f5f9;color:#1e293b
}
header{
  background:linear-gradient(135deg,#102a43,#2563eb);
  color:white;padding:25px 16px
}
.container{max-width:1100px;margin:auto;padding:16px}
.header-row{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap
}
h1{font-size:23px;margin:0}
header p{color:#dbeafe}
.back{
  color:white;text-decoration:none;
  border:1px solid #ffffff80;padding:10px 14px;
  border-radius:10px
}
.card{
  background:white;border:1px solid #e2e8f0;
  border-radius:16px;padding:20px;margin-bottom:18px;
  box-shadow:0 5px 18px #0f172a08
}
h2{font-size:19px;margin-top:0}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px
}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}
input{
  width:100%;padding:12px;border:1px solid #cbd5e1;
  border-radius:9px;font:inherit;outline:none
}
input:focus{border-color:#2563eb}
button{
  border:0;border-radius:9px;padding:11px 15px;
  background:#2563eb;color:white;font:inherit;
  cursor:pointer;font-weight:bold
}
button:disabled{opacity:.6;cursor:wait}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.secondary{background:#e2e8f0;color:#1e293b}
.edit{background:#059669}
.delete{background:#dc2626}
.small{padding:7px 9px;font-size:12px;margin:2px}
.status{
  background:#eff6ff;color:#1d4ed8;border-radius:9px;
  padding:12px;margin-top:15px;overflow-wrap:anywhere;
  font-size:13px;white-space:pre-wrap
}
.stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;margin:15px 0
}
.stat{
  background:#f8fafc;border:1px solid #e2e8f0;
  padding:15px;border-radius:12px
}
.stat span{display:block;color:#64748b;font-size:13px}
.stat strong{display:block;color:#2563eb;font-size:24px;margin-top:8px}
.table-wrap{overflow-x:auto}
table{width:100%;min-width:650px;border-collapse:collapse}
th,td{
  padding:12px;text-align:right;border-bottom:1px solid #e2e8f0;
  font-size:13px
}
th{background:#f8fafc;white-space:nowrap}
.empty{text-align:center;color:#64748b;padding:25px}
footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
@media(max-width:600px){
  .grid,.stats{grid-template-columns:1fr}
  .card{padding:14px}
  h1{font-size:20px}
}
</style></head><body>
<header>
  <div class="container header-row">
    <div>
      <h1>👨‍🏫 د استادانو مدیریت</h1>
      <p>احمدزي عالي لېسه | د استادانو ثبت او تنظیم</p>
    </div>
    <a class="back" href="dashboard.html">← ډیشبورډ</a>
  </div>
</header><main class="container">
  <section class="card">
    <h2 id="formTitle">📝 د استاد معلومات</h2><form id="teacherForm">
  <div id="formFields" class="grid"></div>
  <div class="actions">
    <button id="saveButton" type="submit">➕ استاد ثبت کړئ</button>
    <button id="clearButton" class="secondary" type="button">فورمه پاکه کړئ</button>
  </div>
</form>

<div id="status" class="status">د ډیټابېس اتصال...</div>

  </section>  <section class="card">
    <h2>📊 د استادانو لېست</h2><div class="stats">
  <div class="stat">
    <span>ټول استادان</span>
    <strong id="total">0</strong>
  </div>
  <div class="stat">
    <span>د لټون پایلې</span>
    <strong id="shown">0</strong>
  </div>
</div>

<label for="search">د استادانو لټون</label>
<input id="search" placeholder="د استاد نوم یا نور معلومات ولیکئ">

<br><br>

<div class="table-wrap">
  <table>
    <thead id="tableHead"></thead>
    <tbody id="teacherList">
      <tr><td class="empty">معلومات لوډ کېږي...</td></tr>
    </tbody>
  </table>
</div>

  </section>
</main><footer>احمدزي عالي لېسه © ۲۰۲۶</footer><script>
'use strict';

const SUPABASE_URL='https://oaxmnfnaqhdvnykawvyh.supabase.co';
const SUPABASE_KEY='sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7';
const TABLE='teachers';

const headers={
  apikey:SUPABASE_KEY,
  Authorization:'Bearer '+SUPABASE_KEY,
  'Content-Type':'application/json'
};

const $=id=>document.getElementById(id);

let teachers=[];
let columns=[];
let editingId=null;

const labels={
  name:'د استاد نوم',
  full_name:'د استاد بشپړ نوم',
  teacher_name:'د استاد نوم',
  code:'د استاد کوډ',
  phone:'د اړیکې شمېره',
  phone_number:'د اړیکې شمېره',
  qualification:'تحصیلي درجه',
  education:'تحصیلي درجه',
  subject:'د تدریس مضمون',
  subject_name:'د تدریس مضمون',
  father:'د پلار نوم',
  fathername:'د پلار نوم',
  address:'پته',
  email:'برېښنالیک',
  gender:'جنسیت',
  id:'د استاد اصلي ID',
  teacher_id:'د استاد اصلي ID',
  created_at:'د ثبت نېټه'
};

const hiddenColumns=['id','teacher_id','created_at','updated_at'];

function safe(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  })[c]);
}

function showMessage(message,error=false){
  $('status').textContent=message;
  $('status').style.background=error?'#fef2f2':'#eff6ff';
  $('status').style.color=error?'#b91c1c':'#1d4ed8';
}

function labelFor(column){
  return labels[column]||column.replace(/_/g,' ');
}

function idColumn(){
  if(columns.includes('id'))return 'id';
  if(columns.includes('teacher_id'))return 'teacher_id';
  return null;
}

function findNameColumn(){
  return ['name','full_name','teacher_name']
    .find(column=>columns.includes(column));
}

function visibleColumns(){
  return columns.filter(column=>
    !hiddenColumns.includes(column)&&
    !column.startsWith('created_')&&
    !column.startsWith('updated_')
  );
}

function makeForm(){
  const idKey=idColumn();
  const nameKey=findNameColumn();

  const fields=visibleColumns().filter(column=>column!==idKey);

  $('formFields').innerHTML=fields.map(column=>`
    <div>
      <label for="field_${safe(column)}">
        ${safe(labelFor(column))}${column===nameKey?' *':''}
      </label>
      <input
        id="field_${safe(column)}"
        data-column="${safe(column)}"
        ${column===nameKey?'required':''}
        placeholder="${safe(labelFor(column))} ولیکئ">
    </div>
  `).join('');

  $('tableHead').innerHTML='<tr>'+
    '<th>اصلي ID</th>'+
    visibleColumns().filter(c=>c!==idKey)
      .map(c=>`<th>${safe(labelFor(c))}</th>`).join('')+
    '<th>کړنې</th></tr>';
}

async function request(url,options={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);

  try{
    const response=await fetch(url,{
      ...options,
      headers:{...headers,...options.headers},
      signal:controller.signal
    });

    const text=await response.text();

    if(!response.ok){
      throw new Error(text||`HTTP ${response.status}`);
    }

    return text?JSON.parse(text):null;
  }catch(error){
    if(error.name==='AbortError'){
      throw new Error('د اتصال وخت پای ته ورسېد؛ انټرنېټ او Supabase وګورئ.');
    }
    throw error;
  }finally{
    clearTimeout(timer);
  }
}

async function loadTeachers(){
  showMessage('د استادانو معلومات ترلاسه کېږي...');

  try{
    const result=await request(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&limit=1`
    );

    if(!Array.isArray(result)||result.length===0){
      teachers=[];
      $('total').textContent='0';
      $('shown').textContent='0';
      $('teacherList').innerHTML=
        '<tr><td class="empty">د کالمونو د معلومولو لپاره د teachers جدول جوړښت ته اړتیا ده؛ که جدول خالي وي، د Supabase د کالمونو سکرین‌شاټ راولېږئ.</td></tr>';
      showMessage('جدول خالي دی یا د کالمونو معلومات نه ترلاسه کېږي.',true);
      return;
    }

    columns=Object.keys(result[0]);

    if(!idColumn()){
      throw new Error('په جدول کې id یا teacher_id کالم نشته.');
    }

    if(!findNameColumn()){
      throw new Error('د استاد نوم کالم ونه موندل شو.');
    }

    makeForm();

    teachers=await request(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=${idColumn()}.desc`
    );

    renderTeachers();
    showMessage('د استادانو معلومات په بریالیتوب ترلاسه شول.');

  }catch(error){
    $('teacherList').innerHTML=
      `<tr><td class="empty">${safe(error.message)}</td></tr>`;
    showMessage('ستونزه: '+error.message,true);
  }
}

function renderTeachers(){
  const query=$('search').value.trim().toLowerCase();
  const idKey=idColumn();
  const visible=visibleColumns().filter(c=>c!==idKey);

  const filtered=teachers.filter(teacher=>
    Object.values(teacher).some(value=>
      String(value??'').toLowerCase().includes(query)
    )
  );

  $('total').textContent=teachers.length;
  $('shown').textContent=filtered.length;

  if(filtered.length===0){
    $('teacherList').innerHTML=
      `<tr><td colspan="${visible.length+2}" class="empty">استاد ونه موندل شو.</td></tr>`;
    return;
  }

  $('teacherList').innerHTML=filtered.map(teacher=>{
    const originalIndex=teachers.indexOf(teacher);

    return `<tr>
      <td>${safe(teacher[idKey]??'—')}</td>
      ${visible.map(column=>`<td>${safe(teacher[column]??'—')}</td>`).join('')}
      <td>
        <button class="small edit" onclick="editTeacher(${originalIndex})">اصلاح</button>
        <button class="small delete" onclick="deleteTeacher(${originalIndex})">حذف</button>
      </td>
    </tr>`;
  }).join('');
}

function editTeacher(index){
  const teacher=teachers[index];
  const key=idColumn();

  if(!teacher||!key){
    showMessage('د استاد ID ونه موندل شو.',true);
    return;
  }

  editingId=teacher[key];

  document.querySelectorAll('[data-column]').forEach(input=>{
    input.value=teacher[input.dataset.column]??'';
  });

  $('saveButton').textContent='💾 بدلونونه خوندي کړئ';
  $('formTitle').textContent='✏️ د استاد معلومات اصلاح کړئ';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteTeacher(index){
  const teacher=teachers[index];
  const key=idColumn();

  if(!teacher||!key){
    showMessage('د استاد ID ونه موندل شو.',true);
    return;
  }

  if(!confirm(`ایا د ID ${teacher[key]} لرونکی استاد حذف کړئ؟`))return;

  try{
    await request(
      `${SUPABASE_URL}/rest/v1/${TABLE}?${key}=eq.${encodeURIComponent(teacher[key])}`,
      {method:'DELETE',headers:{Prefer:'return=minimal'}}
    );

    resetForm();
    await loadTeachers();
    showMessage('استاد په بریالیتوب حذف شو.');
  }catch(error){
    showMessage('حذف ناکام شو: '+error.message,true);
  }
}

$('teacherForm').addEventListener('submit',async event=>{
  event.preventDefault();

  const payload={};
  const key=idColumn();

  document.querySelectorAll('[data-column]').forEach(input=>{
    const column=input.dataset.column;
    if(column!==key){
      payload[column]=input.value.trim()||null;
    }
  });

  const nameKey=findNameColumn();

  if(!nameKey||!payload[nameKey]){
    showMessage('د استاد نوم ولیکئ.',true);
    return;
  }

  const button=$('saveButton');
  button.disabled=true;

  try{
    let url=`${SUPABASE_URL}/rest/v1/${TABLE}`;
    let method='POST';

    if(editingId!==null){
      url+=`?${key}=eq.${encodeURIComponent(editingId)}`;
      method='PATCH';
    }

    /*
      د نوي استاد په ثبت کې id نه لېږل کېږي.
      د teachers.id DEFAULT nextval(...) له مخې
      Supabase/PostgreSQL به ID په اتومات ډول جوړ کړي.
    */
    await request(url,{
      method,
      headers:{Prefer:'return=representation'},
      body:JSON.stringify(payload)
    });

    resetForm();
    await loadTeachers();
    showMessage(editingId===null
      ?'د استاد د ثبت غوښتنه بریالۍ شوه.'
      :'د استاد معلومات اصلاح شول.');

  }catch(error){
    showMessage('ثبت یا اصلاح ناکام شو: '+error.message,true);
  }finally{
    button.disabled=false;
  }
});

function resetForm(){
  $('teacherForm').reset();
  editingId=null;
  $('saveButton').textContent='➕ استاد ثبت کړئ';
  $('formTitle').textContent='📝 د استاد معلومات';
}

$('clearButton').addEventListener('click',resetForm);
$('search').addEventListener('input',renderTeachers);

loadTeachers();
</script></body>
</html>
