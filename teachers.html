<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>د استادانو مدیریت | احمدزي عالي لېسه</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b
}
header{
  background:linear-gradient(135deg,#102a43,#2563eb);
  color:white;
  padding:25px 16px
}
.container{max-width:1100px;margin:auto;padding:16px}
.header-row{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap
}
h1{font-size:23px;margin:0}
header p{color:#dbeafe}
.back{
  color:white;text-decoration:none;
  border:1px solid #ffffff80;
  padding:10px 14px;border-radius:10px
}
.card{
  background:white;border:1px solid #e2e8f0;
  border-radius:16px;padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 18px #0f172a08
}
h2{font-size:19px;margin-top:0}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px
}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}
input{
  width:100%;padding:12px;
  border:1px solid #cbd5e1;border-radius:9px;
  font:inherit;outline:none
}
input:focus{border-color:#2563eb}
button{
  border:0;border-radius:9px;padding:11px 15px;
  background:#2563eb;color:white;
  font:inherit;cursor:pointer;font-weight:bold
}
button:disabled{opacity:.6}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.secondary{background:#e2e8f0;color:#1e293b}
.edit{background:#059669}
.delete{background:#dc2626}
.small{padding:7px 9px;font-size:12px;margin:2px}
.status{
  background:#eff6ff;color:#1d4ed8;
  border-radius:9px;padding:12px;margin-top:15px;
  overflow-wrap:anywhere;font-size:13px
}
.stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;margin:15px 0
}
.stat{background:#f8fafc;border:1px solid #e2e8f0;padding:15px;border-radius:12px}
.stat span{display:block;color:#64748b;font-size:13px}
.stat strong{display:block;color:#2563eb;font-size:24px;margin-top:8px}
.table-wrap{overflow-x:auto}
table{width:100%;min-width:650px;border-collapse:collapse}
th,td{padding:12px;text-align:right;border-bottom:1px solid #e2e8f0;font-size:13px}
th{background:#f8fafc;white-space:nowrap}
.empty{text-align:center;color:#64748b;padding:25px}
footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
@media(max-width:600px){
 .grid,.stats{grid-template-columns:1fr}
 .card{padding:14px}
 h1{font-size:20px}
}
</style>
</head>

<body>
<header>
  <div class="container header-row">
    <div>
      <h1>👨‍🏫 د استادانو مدیریت</h1>
      <p>احمدزي عالي لېسه | د استادانو ثبت او تنظیم</p>
    </div>
    <a class="back" href="dashboard.html">← ډیشبورډ</a>
  </div>
</header>

<main class="container">
  <section class="card">
    <h2 id="formTitle">📝 د استاد معلومات</h2>
    <form id="teacherForm">
      <div id="formFields" class="grid"></div>
      <div class="actions">
        <button id="saveButton" type="submit">➕ استاد ثبت کړئ</button>
        <button id="clearButton" class="secondary" type="button">فورمه پاکه کړئ</button>
      </div>
    </form>
    <div id="status" class="status">د ډیټابېس اتصال...</div>
  </section>

  <section class="card">
    <h2>📊 د استادانو لېست</h2>
    <div class="stats">
      <div class="stat"><span>ټول استادان</span><strong id="total">0</strong></div>
      <div class="stat"><span>د لټون پایلې</span><strong id="shown">0</strong></div>
    </div>
    <label for="search">د استادانو لټون</label>
    <input id="search" placeholder="د استاد نوم یا نور معلومات ولیکئ">
    <br><br>
    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="teacherList">
          <tr><td class="empty">معلومات لوډ کېږي...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer>احمدزي عالي لېسه © ۲۰۲۶</footer>

<script>
'use strict';

const SUPABASE_URL='https://oaxmnfnaqhdvnykawvyh.supabase.co';
const SUPABASE_KEY='sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7';
const TABLE='teachers';

const headers={
  apikey:SUPABASE_KEY,
  Authorization:'Bearer '+SUPABASE_KEY,
  'Content-Type':'application/json'
};

const $=id=>document.getElementById(id);
let teachers=[];
let columns=[];
let editingId=null;

/* د ډیټابېس د کالمونو احتمالي نومونه */
const labels={
  name:'د استاد نوم',
  full_name:'د استاد بشپړ نوم',
  teacher_name:'د استاد نوم',
  phone:'د اړیکې شمېره',
  phone_number:'د اړیکې شمېره',
  qualification:'تحصیلي درجه',
  education:'تحصیلي درجه',
  subject:'د تدریس مضمون',
  subject_name:'د تدریس مضمون',
  father:'د پلار نوم',
  fathername:'د پلار نوم',
  address:'پته',
  email:'برېښنالیک',
  gender:'جنسیت',
  id:'پېژندشمېره',
  teacher_id:'د استاد پېژندشمېره',
  created_at:'د ثبت نېټه'
};

const hiddenColumns=[
  'id','teacher_id','created_at','updated_at'
];

function safe(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  })[c]);
}

function showMessage(msg,error=false){
  $('status').textContent=msg;
  $('status').style.background=error?'#fef2f2':'#eff6ff';
  $('status').style.color=error?'#b91c1c':'#1d4ed8';
}

function labelFor(col){
  return labels[col] || col.replace(/_/g,' ');
}

function idColumn(){
  if(columns.includes('id'))return 'id';
  if(columns.includes('teacher_id'))return 'teacher_id';
  return null;
}

function findNameColumn(){
  return ['name','full_name','teacher_name']
    .find(c=>columns.includes(c));
}

function makeForm(){
  const visible=columns.filter(c=>
    !hiddenColumns.includes(c) &&
    !c.startsWith('created_') &&
    !c.startsWith('updated_')
  );

  $('formFields').innerHTML=visible.map(c=>`
    <div>
      <label for="field_${safe(c)}">${safe(labelFor(c))}${c===findNameColumn()?' *':''}</label>
      <input
        id="field_${safe(c)}"
        data-column="${safe(c)}"
        ${c===findNameColumn()?'required':''}
        placeholder="${safe(labelFor(c))} ولیکئ">
    </div>
  `).join('');

  const shown=visible.filter(c=>c!==idColumn());

  $('tableHead').innerHTML='<tr>'+
    '<th>شمېره</th>'+
    shown.map(c=>`<th>${safe(labelFor(c))}</th>`).join('')+
    '<th>کړنې</th></tr>';
}

async function loadTeachers(){
  showMessage('د جدول جوړښت او معلومات ترلاسه کېږي...');

  try{
    /*
      د جدول معلومات ترلاسه کېږي.
      که جدول خالي وي، PostgREST معمولاً د select=* ځواب
      د [] په بڼه ورکوي؛ د خالي ځواب له مخې د کالمونو
      نومونه نه شو معلومولای.
    */
    const response=await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&limit=1`,
      {headers}
    );

    if(!response.ok)throw new Error(await response.text());

    const sample=await response.json();

    if(sample.length===0){
      $('teacherList').innerHTML=
        '<tr><td class="empty">جدول خالي دی. د کالمونو د دقیق معلومولو لپاره د Supabase د جدول سکرین‌شاټ ته اړتیا ده.</td></tr>';
      $('total').textContent='0';
      $('shown').textContent='0';
      showMessage('جدول خالي دی؛ د کالمونو نومونه په اتومات ډول نه شي معلومېدای.',true);
      return;
    }

    columns=Object.keys(sample[0]);
    makeForm();

    const all=await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*`,
      {headers}
    );

    if(!all.ok)throw new Error(await all.text());

    teachers=await all.json();
    renderTeachers();
    showMessage('د استادانو معلومات ترلاسه شول. د ثبت لپاره د کالمونو نومونه له ډیټابېس څخه اخیستل شوي.');

  }catch(error){
    $('teacherList').innerHTML=
      `<tr><td class="empty">${safe(error.message)}</td></tr>`;
    showMessage('د ډیټابېس ستونزه: '+error.message,true);
  }
}

function renderTeachers(){
  const q=$('search').value.trim().toLowerCase();
  const visible=columns.filter(c=>
    !hiddenColumns.includes(c) &&
    !c.startsWith('created_') &&
    !c.startsWith('updated_')
  );

  const filtered=teachers.filter(t=>
    Object.values(t).join(' ').toLowerCase().includes(q)
  );

  $('total').textContent=teachers.length;
  $('shown').textContent=filtered.length;

  if(!filtered.length){
    $('teacherList').innerHTML=
      `<tr><td colspan="${visible.length+2}" class="empty">استاد ونه موندل شو.</td></tr>`;
    return;
  }

  $('teacherList').innerHTML=filtered.map((t,i)=>{
    const original=teachers.indexOf(t);

    return '<tr><td>'+(i+1)+'</td>'+
      visible.map(c=>`<td>${safe(t[c]??'—')}</td>`).join('')+
      `<td>
        <button class="small edit" onclick="editTeacher(${original})">اصلاح</button>
        <button class="small delete" onclick="deleteTeacher(${original})">حذف</button>
      </td></tr>`;
  }).join('');
}

function editTeacher(index){
  const t=teachers[index];
  const key=idColumn();

  if(!t)return;

  if(!key || t[key]==null){
    showMessage('د جدول د ثبتونو لپاره د id یا teacher_id کالم ته اړتیا ده.',true);
    return;
  }

  editingId=t[key];

  columns.forEach(c=>{
    const input=document.querySelector(`[data-column="${c}"]`);
    if(input)input.value=t[c]??'';
  });

  $('saveButton').textContent='💾 بدلونونه خوندي کړئ';
  $('formTitle').textContent='✏️ د استاد معلومات اصلاح کړئ';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteTeacher(index){
  const t=teachers[index];
  const key=idColumn();

  if(!key || !t || t[key]==null){
    showMessage('د استاد د پېژندنې کالم ونه موندل شو.',true);
    return;
  }

  if(!confirm('ایا غواړئ دا استاد حذف کړئ؟'))return;

  try{
    const r=await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?${key}=eq.${encodeURIComponent(t[key])}`,
      {method:'DELETE',headers:{...headers,Prefer:'return=minimal'}}
    );

    if(!r.ok)throw new Error(await r.text());

    resetForm();
    await loadTeachers();
    showMessage('استاد حذف شو.');
  }catch(e){
    showMessage('حذف ناکام شو: '+e.message,true);
  }
}

$('teacherForm').addEventListener('submit',async e=>{
  e.preventDefault();

  const payload={};

  document.querySelectorAll('[data-column]').forEach(input=>{
    const col=input.dataset.column;
    if(col!==idColumn()){
      payload[col]=input.value.trim()||null;
    }
  });

  const nameCol=findNameColumn();

  if(nameCol && !payload[nameCol]){
    showMessage('د استاد نوم ولیکئ.',true);
    return;
  }

  if(!nameCol){
    showMessage('د جدول د نوم کالم معلوم نه شو. د teachers جدول سکرین‌شاټ راولېږئ.',true);
    return;
  }

  const button=$('saveButton');
  button.disabled=true;

  try{
    let url=`${SUPABASE_URL}/rest/v1/${TABLE}`;
    let method='POST';

    if(editingId!==null){
      const key=idColumn();
      if(!key)throw new Error('د id کالم ونه موندل شو.');
      url+=`?${key}=eq.${encodeURIComponent(editingId)}`;
      method='PATCH';
    }

    const r=await fetch(url,{
      method,
      headers:{...headers,Prefer:'return=representation'},
      body:JSON.stringify(payload)
    });

    if(!r.ok)throw new Error(await r.text());

    resetForm();
    await loadTeachers();
    showMessage('د ثبت یا اصلاح غوښتنه بشپړه شوه.');

  }catch(error){
    showMessage('ثبت یا اصلاح ناکام شو: '+error.message,true);
  }finally{
    button.disabled=false;
  }
});

function resetForm(){
  $('teacherForm').reset();
  editingId=null;
  $('saveButton').textContent='➕ استاد ثبت کړئ';
  $('formTitle').textContent='📝 د استاد معلومات';
}

$('clearButton').addEventListener('click',resetForm);
$('search').addEventListener('input',renderTeachers);

loadTeachers();
</script>
</body>
</html>
