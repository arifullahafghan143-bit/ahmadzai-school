<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>د استادانو مدیریت | احمدزي عالي لېسه</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --primary: #123c69;
    --secondary: #176b87;
    --success: #087f5b;
    --danger: #dc2626;
    --background: #f1f5f9;
    --border: #dbe3ec;
    --text: #172033;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: var(--background);
    color: var(--text);
    line-height: 1.7;
}

header {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

header p {
    margin: 0;
    font-size: 14px;
}

.back {
    display: inline-block;
    margin-top: 15px;
    color: white;
    text-decoration: none;
    background: #ffffff22;
    padding: 9px 16px;
    border-radius: 8px;
}

.container {
    max-width: 1150px;
    margin: 25px auto;
    padding: 0 14px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.stat-box {
    background: white;
    border-radius: 12px;
    padding: 17px;
    text-align: center;
    box-shadow: 0 4px 15px #0000000b;
}

.stat-box span {
    display: block;
    color: #64748b;
    font-size: 14px;
}

.stat-box strong {
    display: block;
    font-size: 25px;
    color: var(--success);
    margin-top: 5px;
    overflow-wrap: anywhere;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: 0 4px 15px #0000000b;
}

.card h2 {
    margin: 0 0 20px;
    color: var(--primary);
    font-size: 20px;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 12px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: white;
    color: var(--text);
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: var(--secondary);
    box-shadow: 0 0 0 3px #176b871a;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
}

button:disabled {
    opacity: .65;
    cursor: wait;
}

.save-btn {
    background: var(--success);
    color: white;
    margin-top: 20px;
}

.cancel-btn {
    background: #64748b;
    color: white;
    margin-top: 20px;
    display: none;
}

.refresh-btn {
    background: var(--secondary);
    color: white;
}

.edit-btn {
    background: #dbeafe;
    color: #1d4ed8;
    padding: 7px 10px;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
    padding: 7px 10px;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
    line-height: 1.8;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.message.info {
    display: block;
    background: #dbeafe;
    color: #1e40af;
}

.toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 15px;
}

.search {
    flex: 1;
    margin: 0;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
}

table {
    width: 100%;
    min-width: 780px;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    white-space: nowrap;
}

th {
    background: #eaf2f8;
    color: var(--primary);
}

tbody tr:hover {
    background: #f8fafc;
}

tbody tr:last-child td {
    border-bottom: none;
}

.actions {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
}

.code-badge {
    display: inline-block;
    background: #e0f2fe;
    color: #075985;
    padding: 3px 9px;
    border-radius: 6px;
    font-weight: bold;
    direction: ltr;
}

.id-badge {
    display: inline-block;
    background: #dcfce7;
    color: #166534;
    padding: 3px 9px;
    border-radius: 6px;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 25px;
    white-space: normal;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    padding: 10px 0 25px;
}

@media (max-width: 600px) {
    .container {
        margin-top: 15px;
        padding: 0 10px;
    }

    header h1 {
        font-size: 21px;
    }

    .stats {
        gap: 10px;
    }

    .stat-box {
        padding: 13px 8px;
    }

    .stat-box strong {
        font-size: 21px;
    }

    .card {
        padding: 15px;
        border-radius: 11px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .toolbar button {
        width: 100%;
    }

    .search {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>احمدزي عالي لېسه</h1>
    <p>د استادانو د ثبت او مدیریت سیستم</p>
    <a class="back" href="dashboard.html">ډشبورډ ته بېرته تلل</a>
</header>

<main class="container">

    <section class="stats">
        <div class="stat-box">
            <span>ټول استادان</span>
            <strong id="totalTeachers">۰</strong>
        </div>

        <div class="stat-box">
            <span>د سیستم حالت</span>
            <strong id="systemStatus" style="font-size:17px">د نښلېدو په حال کې</strong>
        </div>
    </section>

    <section class="card">
        <h2 id="formTitle">➕ نوی استاد ثبت کړئ</h2>

        <form id="teacherForm">

            <div class="form-grid">

                <div>
                    <label for="teacherName">د استاد بشپړ نوم *</label>
                    <input
                        id="teacherName"
                        type="text"
                        placeholder="د استاد نوم ولیکئ"
                        maxlength="150"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="father">د پلار نوم</label>
                    <input
                        id="father"
                        type="text"
                        placeholder="د پلار نوم ولیکئ"
                        maxlength="150"
                    >
                </div>

                <div>
                    <label for="phone">د اړیکې شمېره</label>
                    <input
                        id="phone"
                        type="tel"
                        placeholder="د ټیلیفون شمېره"
                        maxlength="30"
                        inputmode="tel"
                    >
                </div>

                <div>
                    <label for="subject">مضمون</label>
                    <input
                        id="subject"
                        type="text"
                        placeholder="لکه: ریاضي"
                        maxlength="150"
                    >
                </div>

            </div>

            <button class="save-btn" id="saveBtn" type="submit">
                استاد ثبت کړئ
            </button>

            <button class="cancel-btn" id="cancelBtn" type="button">
                سمون لغوه کړئ
            </button>

            <div id="formMessage" class="message" role="status"></div>

        </form>
    </section>

    <section class="card">
        <h2>📋 د استادانو لېست</h2>

        <div class="toolbar">
            <input
                class="search"
                id="searchInput"
                type="search"
                placeholder="د ID، کوډ، نوم یا مضمون له مخې لټون..."
                aria-label="د استادانو لټون"
            >

            <button class="refresh-btn" id="refreshBtn" type="button">
                ↻ جدول تازه کړئ
            </button>
        </div>

        <div id="tableMessage" class="message" role="status"></div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>اصلي ID</th>
                        <th>د استاد کوډ</th>
                        <th>د استاد نوم</th>
                        <th>د پلار نوم</th>
                        <th>ټیلیفون</th>
                        <th>مضمون</th>
                        <th>عملیات</th>
                    </tr>
                </thead>

                <tbody id="teachersBody">
                    <tr>
                        <td colspan="7" class="empty">
                            معلومات لوډ کېږي...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div class="footer">
        د احمدزي عالي لېسې د مدیریت سیستم
    </div>

</main>

<script>
'use strict';

/*
  د Supabase معلومات
  ID او code د فورم له لارې نه لېږل کېږي.
  ID د ډیټابېس له خوا جوړېږي.
  code د teachers_code_trigger له لارې جوړېږي.
*/

const SUPABASE_URL =
    'https://oaxmnfnaqhdvnykawvyh.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7';

const API = SUPABASE_URL + '/rest/v1/teachers';

let teachers = [];
let editingId = null;
let isSaving = false;
let isLoading = false;

const form = document.getElementById('teacherForm');
const nameInput = document.getElementById('teacherName');
const fatherInput = document.getElementById('father');
const phoneInput = document.getElementById('phone');
const subjectInput = document.getElementById('subject');

const saveBtn = document.getElementById('saveBtn');
const cancelBtn = document.getElementById('cancelBtn');

const formMessage = document.getElementById('formMessage');
const tableMessage = document.getElementById('tableMessage');
const teachersBody = document.getElementById('teachersBody');
const totalTeachers = document.getElementById('totalTeachers');
const systemStatus = document.getElementById('systemStatus');
const searchInput = document.getElementById('searchInput');

function requestHeaders(extra = {}) {
    return {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        ...extra
    };
}

function showMessage(element, message, type) {
    element.textContent = message;
    element.className = 'message ' + type;
}

function hideMessage(element) {
    element.textContent = '';
    element.className = 'message';
}

/* د HTML د خوندي ښودلو لپاره */
function safe(value) {
    const span = document.createElement('span');
    span.textContent = value == null ? '' : String(value);
    return span.innerHTML;
}

/* د Supabase د خطا پیغام لوستل */
async function readResponse(response) {
    const text = await response.text();

    let data = null;

    if (text) {
        try {
            data = JSON.parse(text);
        } catch {
            data = { message: text };
        }
    }

    if (!response.ok) {
        const detail = data && (
            data.message ||
            data.details ||
            data.hint ||
            data.error
        );

        throw new Error(
            detail || ('د سرور خطا: HTTP ' + response.status)
        );
    }

    return data;
}

/* د استادانو د معلوماتو لوډ کول */
async function loadTeachers() {
    if (isLoading) return;

    isLoading = true;
    systemStatus.textContent = 'لوډ کېږي...';

    teachersBody.innerHTML =
        '<tr><td colspan="7" class="empty">معلومات لوډ کېږي...</td></tr>';

    try {
        const response = await fetch(
            API + '?select=id,code,name,father,phone,subject&order=id.asc',
            {
                method: 'GET',
                headers: requestHeaders()
            }
        );

        const data = await readResponse(response);

        teachers = Array.isArray(data) ? data : [];

        totalTeachers.textContent = String(teachers.length);
        systemStatus.textContent = 'وصل دی';

        renderTeachers();

    } catch (error) {
        systemStatus.textContent = 'ستونزه';

        teachersBody.innerHTML =
            '<tr><td colspan="7" class="empty">د استادانو معلومات لوډ نه شول.</td></tr>';

        showMessage(
            tableMessage,
            'د معلوماتو ستونزه: ' + error.message,
            'error'
        );

    } finally {
        isLoading = false;
    }
}

/* د استادانو جدول او لټون */
function renderTeachers() {
    const query = searchInput.value.trim().toLocaleLowerCase();

    const filtered = teachers.filter(teacher => {
        const values = [
            teacher.id,
            teacher.code,
            teacher.name,
            teacher.father,
            teacher.phone,
            teacher.subject
        ];

        return values.some(value =>
            String(value ?? '').toLocaleLowerCase().includes(query)
        );
    });

    if (filtered.length === 0) {
        teachersBody.innerHTML =
            '<tr><td colspan="7" class="empty">' +
            (query
                ? 'د لټون له مخې استاد پیدا نه شو.'
                : 'تر اوسه استاد نشته. د پورته فورم له لارې نوی استاد ثبت کړئ.') +
            '</td></tr>';

        return;
    }

    teachersBody.innerHTML = filtered.map(teacher => {
        const id = Number(teacher.id);

        return `
            <tr>
                <td>
                    <span class="id-badge">${safe(teacher.id)}</span>
                </td>

                <td>
                    <span class="code-badge">${safe(teacher.code || '—')}</span>
                </td>

                <td>${safe(teacher.name)}</td>
                <td>${safe(teacher.father || '—')}</td>
                <td>${safe(teacher.phone || '—')}</td>
                <td>${safe(teacher.subject || '—')}</td>

                <td>
                    <div class="actions">
                        <button
                            class="edit-btn"
                            type="button"
                            data-action="edit"
                            data-id="${id}">
                            سمون
                        </button>

                        <button
                            class="delete-btn"
                            type="button"
                            data-action="delete"
                            data-id="${id}">
                            حذف
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}

/* د ثبتولو او اصلاح کولو فورم */
form.addEventListener('submit', async function(event) {
    event.preventDefault();

    if (isSaving) return;

    hideMessage(formMessage);

    const name = nameInput.value.trim();

    if (!name) {
        showMessage(
            formMessage,
            'مهرباني وکړئ د استاد بشپړ نوم ولیکئ.',
            'error'
        );
        nameInput.focus();
        return;
    }

    /*
      مهم:
      id او code په payload کې نشته.
      ډیټابېس یې په اتومات ډول جوړوي.
    */
    const payload = {
        name: name,
        father: fatherInput.value.trim() || null,
        phone: phoneInput.value.trim() || null,
        subject: subjectInput.value.trim() || null
    };

    isSaving = true;
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.textContent = 'مهرباني وکړئ...';

    const currentEditingId = editingId;

    try {
        let response;

        if (currentEditingId === null) {
            response = await fetch(API, {
                method: 'POST',
                headers: requestHeaders({
                    'Prefer': 'return=representation'
                }),
                body: JSON.stringify(payload)
            });

        } else {
            response = await fetch(
                API + '?id=eq.' + encodeURIComponent(currentEditingId),
                {
                    method: 'PATCH',
                    headers: requestHeaders({
                        'Prefer': 'return=representation'
                    }),
                    body: JSON.stringify(payload)
                }
            );
        }

        const result = await readResponse(response);

        if (!Array.isArray(result) || result.length === 0) {
            throw new Error(
                'سرور معلومات بېرته راونه لېږل. د Supabase د اجازو تنظیم وګورئ.'
            );
        }

        const savedTeacher = result[0];
        const wasEditing = currentEditingId !== null;

        resetForm();

        showMessage(
            formMessage,
            wasEditing
                ? 'د استاد معلومات په بریالیتوب اصلاح شول. ID: ' +
                    savedTeacher.id +
                    ' | کوډ: ' + (savedTeacher.code || '—')
                : 'نوی استاد په بریالیتوب ثبت شو! ID: ' +
                    savedTeacher.id +
                    ' | کوډ: ' + (savedTeacher.code || '—'),
            'success'
        );

        await loadTeachers();

    } catch (error) {
        showMessage(
            formMessage,
            'عملیات ناکام شول: ' + error.message,
            'error'
        );

    } finally {
        isSaving = false;
        saveBtn.disabled = false;
        cancelBtn.disabled = false;

        saveBtn.textContent =
            editingId === null ? 'استاد ثبت کړئ' : 'معلومات اصلاح کړئ';
    }
});

/* د سمون لپاره د استاد معلومات فورم ته راوړل */
function editTeacher(id) {
    const teacher = teachers.find(
        item => String(item.id) === String(id)
    );

    if (!teacher) {
        showMessage(
            formMessage,
            'د استاد معلومات پیدا نه شول.',
            'error'
        );
        return;
    }

    editingId = teacher.id;

    nameInput.value = teacher.name || '';
    fatherInput.value = teacher.father || '';
    phoneInput.value = teacher.phone || '';
    subjectInput.value = teacher.subject || '';

    document.getElementById('formTitle').textContent =
        '✏️ د استاد معلومات اصلاح کړئ';

    saveBtn.textContent = 'معلومات اصلاح کړئ';
    cancelBtn.style.display = 'inline-block';

    hideMessage(formMessage);

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

/* د استاد حذف */
async function deleteTeacher(id) {
    const teacher = teachers.find(
        item => String(item.id) === String(id)
    );

    if (!teacher) return;

    const confirmed = confirm(
        'ایا غواړئ د استاد "' + teacher.name +
        '" (ID: ' + teacher.id + ') حذف کړئ؟'
    );

    if (!confirmed) return;

    try {
        const response = await fetch(
            API + '?id=eq.' + encodeURIComponent(id),
            {
                method: 'DELETE',
                headers: requestHeaders({
                    'Prefer': 'return=representation'
                })
            }
        );

        const result = await readResponse(response);

        if (!Array.isArray(result) || result.length === 0) {
            throw new Error(
                'استاد حذف نه شو. کېدای شي د حذف اجازه نه وي.'
            );
        }

        if (String(editingId) === String(id)) {
            resetForm();
        }

        showMessage(
            tableMessage,
            'د استاد معلومات په بریالیتوب حذف شول.',
            'success'
        );

        await loadTeachers();

    } catch (error) {
        showMessage(
            tableMessage,
            'د حذف ستونزه: ' + error.message,
            'error'
        );
    }
}

/* د جدول د تڼیو پېژندل */
teachersBody.addEventListener('click', function(event) {
    const button = event.target.closest('button[data-action]');

    if (!button) return;

    const id = button.dataset.id;
    const action = button.dataset
