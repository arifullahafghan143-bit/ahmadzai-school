<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د استادانو مدیریت | احمدزي عالي لېسه</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #172033;
}

header {
    background: linear-gradient(135deg, #123c69, #176b87);
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0 0 10px;
    font-size: 25px;
}

header p {
    margin: 0;
    font-size: 14px;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 14px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px #0000000d;
}

.card h2 {
    margin-top: 0;
    color: #123c69;
    font-size: 20px;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 13px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #176b87;
    box-shadow: 0 0 0 2px #176b871a;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 17px;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
}

.save-btn {
    background: #087f5b;
    color: white;
    margin-top: 18px;
}

.cancel-btn {
    background: #64748b;
    color: white;
    margin-top: 18px;
    display: none;
}

.refresh-btn {
    background: #176b87;
    color: white;
}

.delete-btn {
    background: #dc2626;
    color: white;
    padding: 7px 10px;
    font-size: 13px;
}

.edit-btn {
    background: #dbeafe;
    color: #1d4ed8;
    padding: 7px 10px;
    font-size: 13px;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.info {
    display: block;
    background: #dbeafe;
    color: #1e40af;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 650px;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
}

th {
    background: #eaf2f8;
    color: #123c69;
}

tbody tr:hover {
    background: #f8fafc;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 6px;
}

.search {
    margin: 12px 0 18px;
}

.stats {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}

.stat-box {
    flex: 1;
    background: white;
    border-radius: 12px;
    padding: 17px;
    text-align: center;
    box-shadow: 0 4px 15px #0000000d;
}

.stat-box strong {
    display: block;
    font-size: 26px;
    color: #087f5b;
    margin-top: 8px;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 25px;
}

.back {
    display: inline-block;
    margin-top: 15px;
    color: white;
    text-decoration: none;
    background: #ffffff22;
    padding: 9px 14px;
    border-radius: 8px;
}

@media(max-width: 600px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 15px;
    }

    header h1 {
        font-size: 21px;
    }

    .stats {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <h1>احمدزي عالي لېسه</h1>
    <p>د استادانو د ثبت او مدیریت سیستم</p>
    <a class="back" href="dashboard.html">ډشبورډ ته بېرته تلل</a>
</header>

<main class="container">

    <div class="stats">
        <div class="stat-box">
            ټول استادان
            <strong id="totalTeachers">۰</strong>
        </div>

        <div class="stat-box">
            د سیستم حالت
            <strong id="systemStatus" style="font-size:18px">...</strong>
        </div>
    </div>

    <section class="card">
        <h2 id="formTitle">➕ نوی استاد ثبت کړئ</h2>

        <form id="teacherForm">

            <div class="form-grid">

                <div>
                    <label for="teacherName">د استاد بشپړ نوم *</label>
                    <input
                        id="teacherName"
                        type="text"
                        placeholder="د استاد نوم ولیکئ"
                        required
                    >
                </div>

                <div>
                    <label for="father">د پلار نوم</label>
                    <input
                        id="father"
                        type="text"
                        placeholder="د پلار نوم ولیکئ"
                    >
                </div>

                <div>
                    <label for="phone">د اړیکې شمېره</label>
                    <input
                        id="phone"
                        type="tel"
                        placeholder="د ټیلیفون شمېره"
                    >
                </div>

                <div>
                    <label for="subject">مضمون</label>
                    <input
                        id="subject"
                        type="text"
                        placeholder="لکه: ریاضي"
                    >
                </div>

            </div>

            <button class="save-btn" id="saveBtn" type="submit">
                استاد ثبت کړئ
            </button>

            <button class="cancel-btn" id="cancelBtn" type="button">
                سمون لغوه کړئ
            </button>

            <div id="formMessage" class="message"></div>

        </form>
    </section>

    <section class="card">
        <h2>📋 د استادانو جدول</h2>

        <input
            class="search"
            id="searchInput"
            type="search"
            placeholder="د استاد په نوم یا ID کې لټون..."
        >

        <button class="refresh-btn" id="refreshBtn" type="button">
            جدول تازه کړئ
        </button>

        <div id="tableMessage" class="message"></div>

        <div class="table-wrap" style="margin-top:15px">
            <table>
                <thead>
                    <tr>
                        <th>اصلي ID</th>
                        <th>د استاد نوم</th>
                        <th>د پلار نوم</th>
                        <th>ټیلیفون</th>
                        <th>مضمون</th>
                        <th>عملیات</th>
                    </tr>
                </thead>

                <tbody id="teachersBody">
                    <tr>
                        <td colspan="6" class="empty">
                            معلومات لوډ کېږي...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script>
const SUPABASE_URL =
    'https://oaxmnfnaqhdvnykawvyh.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_I6B4jSPL1L88rYKbhpitzw_8erhz3L7';

const TABLE = 'teachers';

const API = SUPABASE_URL + '/rest/v1/' + TABLE;

let teachers = [];
let editingId = null;

const form = document.getElementById('teacherForm');
const nameInput = document.getElementById('teacherName');
const fatherInput = document.getElementById('father');
const phoneInput = document.getElementById('phone');
const subjectInput = document.getElementById('subject');
const saveBtn = document.getElementById('saveBtn');
const cancelBtn = document.getElementById('cancelBtn');
const formMessage = document.getElementById('formMessage');
const tableMessage = document.getElementById('tableMessage');
const teachersBody = document.getElementById('teachersBody');

function headers(extra = {}) {
    return {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        ...extra
    };
}

function showMessage(element, message, type) {
    element.textContent = message;
    element.className = 'message ' + type;
}

function hideMessage(element) {
    element.textContent = '';
    element.className = 'message';
}

function safe(value) {
    const span = document.createElement('span');
    span.textContent = value == null ? '' : String(value);
    return span.innerHTML;
}

function showError(error) {
    if (error && error.message) {
        return error.message;
    }
    return String(error || 'نامعلومه ستونزه');
}

async function loadTeachers() {
    document.getElementById('systemStatus').textContent = '...';

    teachersBody.innerHTML =
        '<tr><td colspan="6" class="empty">معلومات لوډ کېږي...</td></tr>';

    try {
        const response = await fetch(
            API + '?select=*&order=id.asc',
            {
                method: 'GET',
                headers: headers()
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || data.details || JSON.stringify(data));
        }

        teachers = Array.isArray(data) ? data : [];

        document.getElementById('totalTeachers').textContent =
            teachers.length;

        document.getElementById('systemStatus').textContent = 'وصل دی';

        renderTeachers();

    } catch (error) {
        document.getElementById('systemStatus').textContent = 'ستونزه';

        teachersBody.innerHTML =
            '<tr><td colspan="6" class="empty">جدول نه لوډ کېږي.</td></tr>';

        showMessage(
            tableMessage,
            'د معلوماتو د لوډ ستونزه: ' + showError(error),
            'error'
        );
    }
}

function renderTeachers() {
    hideMessage(tableMessage);

    const query = document.getElementById('searchInput')
        .value.trim().toLowerCase();

    const filtered = teachers.filter(teacher => {
        return [
            teacher.id,
            teacher.name,
            teacher.father,
            teacher.phone,
            teacher.subject
        ].some(value =>
            String(value ?? '').toLowerCase().includes(query)
        );
    });

    if (filtered.length === 0) {
        teachersBody.innerHTML =
            '<tr><td colspan="6" class="empty">تر اوسه استاد نشته. د پورته فورم له لارې نوی استاد ثبت کړئ.</td></tr>';
        return;
    }

    teachersBody.innerHTML = filtered.map(teacher => `
        <tr>
            <td>${safe(teacher.id)}</td>
            <td>${safe(teacher.name)}</td>
            <td>${safe(teacher.father)}</td>
            <td>${safe(teacher.phone)}</td>
            <td>${safe(teacher.subject)}</td>
            <td>
                <div class="actions">
                    <button class="edit-btn"
                        onclick="editTeacher(${Number(teacher.id)})">
                        سمون
                    </button>

                    <button class="delete-btn"
                        onclick="deleteTeacher(${Number(teacher.id)})">
                        حذف
                    </button>
                </div>
            </td>
        </tr>
    `).join('');
}

form.addEventListener('submit', async function(event) {
    event.preventDefault();

    hideMessage(formMessage);

    const name = nameInput.value.trim();

    if (!name) {
        showMessage(formMessage, 'د استاد نوم ولیکئ.', 'error');
        return;
    }

    const payload = {
        name: name,
        father: fatherInput.value.trim() || null,
        phone: phoneInput.value.trim() || null,
        subject: subjectInput.value.trim() || null
    };

    saveBtn.disabled = true;
    saveBtn.textContent = 'مهرباني وکړئ...';

    try {
        let response;

        if (editingId === null) {
            response = await fetch(API, {
                method: 'POST',
                headers: headers({
                    'Prefer': 'return=representation'
                }),
                body: JSON.stringify(payload)
            });
        } else {
            response = await fetch(
                API + '?id=eq.' + encodeURIComponent(editingId),
                {
                    method: 'PATCH',
                    headers: headers({
                        'Prefer': 'return=representation'
                    }),
                    body: JSON.stringify(payload)
                }
            );
        }

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message ||
                result.details ||
                result.hint ||
                JSON.stringify(result)
            );
        }

        if (!Array.isArray(result) || result.length === 0) {
            throw new Error(
                'معلومات ثبت نه شول. د Supabase اجازه او جدول وګورئ.'
            );
        }

        const wasEditing = editingId !== null;

        resetForm();

        showMessage(
            formMessage,
            wasEditing
                ? 'د استاد معلومات په بریالیتوب اصلاح شول.'
                : 'نوی استاد په بریالیتوب ثبت شو. اصلي ID: ' + result[0].id,
            'success'
        );

        await loadTeachers();

    } catch (error) {
        showMessage(
            formMessage,
            'ثبت ناکام شو: ' + showError(error),
            'error'
        );
    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent =
            editingId === null ? 'استاد ثبت کړئ' : 'معلومات اصلاح کړئ';
    }
});

function editTeacher(id) {
    const teacher = teachers.find(item => Number(item.id) === Number(id));

    if (!teacher) {
        showMessage(formMessage, 'استاد پیدا نه شو.', 'error');
        return;
    }

    editingId = id;

    nameInput.value = teacher.name || '';
    fatherInput.value = teacher.father || '';
    phoneInput.value = teacher.phone || '';
    subjectInput.value = teacher.subject || '';

    document.getElementById('formTitle').textContent =
        '✏️ د استاد معلومات اصلاح کړئ';

    saveBtn.textContent = 'معلومات اصلاح کړئ';
    cancelBtn.style.display = 'inline-block';

    hideMessage(formMessage);

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteTeacher(id) {
    const teacher = teachers.find(item => Number(item.id) === Number(id));

    if (!teacher) return;

    const confirmed = confirm(
        'ایا غواړئ د استاد "' + teacher.name + '" معلومات حذف کړئ؟'
    );

    if (!confirmed) return;

    try {
        const response = await fetch(
            API + '?id=eq.' + encodeURIComponent(id),
            {
                method: 'DELETE',
                headers: headers({
                    'Prefer': 'return=representation'
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message ||
                result.details ||
                JSON.stringify(result)
            );
        }

        if (!Array.isArray(result) || result.length === 0) {
            throw new Error(
                'استاد حذف نه شو؛ کېدای شي د حذف اجازه نه وي.'
            );
        }

        showMessage(
            tableMessage,
            'د استاد معلومات حذف شول.',
            'success'
        );

        await loadTeachers();

    } catch (error) {
        showMessage(
            tableMessage,
            'حذف ناکام شو: ' + showError(error),
            'error'
        );
    }
}

function resetForm() {
    editingId = null;
    form.reset();

    document.getElementById('formTitle').textContent =
        '➕ نوی استاد ثبت کړئ';

    saveBtn.textContent = 'استاد ثبت کړئ';
    cancelBtn.style.display = 'none';
}

cancelBtn.addEventListener('click', function() {
    resetForm();
    hideMessage(formMessage);
});

document.getElementById('refreshBtn').addEventListener(
    'click',
    loadTeachers
);

document.getElementById('searchInput').addEventListener(
    'input',
    renderTeachers
);

loadTeachers();
</script>

</body>
</html>
